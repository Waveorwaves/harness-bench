name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The runner image ships Chrome; it screenshots the visual tasks' reference solutions.
      - name: Run tests
        run: python -m unittest discover -s tests -v
        env:
          HB_BROWSER: google-chrome
          HB_BROWSER_FLAGS: "--disable-gpu --use-angle=swiftshader --enable-unsafe-swiftshader"
