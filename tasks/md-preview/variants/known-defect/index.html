<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown Preview</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      height: 100vh;
      box-sizing: border-box;
    }

    #source {
      padding: 10px;
      font-family: monospace;
      font-size: 14px;
      resize: none;
      border: 1px solid #ccc;
    }

    #preview {
      padding: 10px;
      border: 1px solid #ccc;
      overflow: auto;
      line-height: 1.6;
    }

    #preview h1,
    #preview h2,
    #preview h3 {
      margin: 0.5em 0;
    }

    #preview p {
      margin: 0.5em 0;
    }

    #preview ul {
      margin: 0.5em 0;
      padding-left: 2em;
    }

    #preview li {
      margin: 0.25em 0;
    }

    #preview code {
      background: #f0f0f0;
      padding: 2px 4px;
      border-radius: 3px;
      font-family: monospace;
    }

    #preview pre {
      background: #f0f0f0;
      padding: 10px;
      overflow-x: auto;
      border-radius: 3px;
    }

    #preview pre code {
      background: none;
      padding: 0;
      border-radius: 0;
    }

    #preview a {
      color: #0066cc;
      text-decoration: none;
    }

    #preview a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <textarea id="source" placeholder="Enter Markdown here..."></textarea>
  <div id="preview"></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
