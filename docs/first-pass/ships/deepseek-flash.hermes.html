const STATE = {
  T: 0,
  travel: new T.Vector2(0, 0),
  trail: [],
  lastTrailT: -10,
  azimuth: -0.34, elevation: 0.185, dist: 96,
  targetDist: 96,
  targetAz: -0.34, targetEl: 0.185,
  dragging: false, px: 0, py: 0,
  velAz: 0, velEl: 0,
  lastInputT: -10,
  heave: 0
};
const WORLD_UP = new T.Vector3(0, 1, 0);

/* ---------------------------------------------------------------- */
function init() {
  const canvas = document.createElement('canvas');
  canvas.id = 'scene';
  document.body.appendChild(canvas);

  renderer = new T.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  renderer.toneMapping = T.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.outputColorSpace = T.SRGBColorSpace;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = T.PCFSoftShadowMap;

  scene = new T.Scene();
  scene.fog = new T.FogExp2(0xe3a173, 0.00040);

  camera = new T.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.6, 22000);
  camera.position.set(-30, 27, 90);

  buildTextures();
  buildShipMaterials();

  /* lights -------------------------------------------------------- */
  const sun = new T.DirectionalLight(0xffb478, 3.5);
  sun.position.copy(CFG.sunDir).multiplyScalar(170).add(new T.Vector3(0, 8, 0));
  sun.target.position.set(0, 8, 0);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  const sc = sun.shadow.camera;
  sc.left = -46; sc.right = 46; sc.top = 46; sc.bottom = -46;
  sc.near = 20; sc.far = 420;
  sun.shadow.bias = -0.0006;
  sun.shadow.normalBias = 0.035;
  scene.add(sun); scene.add(sun.target);

  const hemi = new T.HemisphereLight(0x9ab6dd, 0x2a1e18, 0.62);
  scene.add(hemi);
  const fill = new T.DirectionalLight(0x89a9d6, 0.55);
  fill.position.set(-40, 30, 60);
  scene.add(fill);
  // warm bounce off the water towards the ship's shaded side
  const bounce = new T.DirectionalLight(0xffa06a, 0.45);
  bounce.position.set(20, -25, 55);
  scene.add(bounce);

  /* world --------------------------------------------------------- */
  sky = buildSky(scene);
  ocean = buildOcean(scene);
  shipData = buildShip();
  scene.add(shipData.group);
  for (const L of shipData.trailObjs.lights) {
    const pl = new T.PointLight(L.color, L.intensity, L.dist, 2.0);
    pl.position.copy(L.pos);
    shipData.group.add(pl);
  }
  shipData.glows = [];
  for (const p of shipData.trailObjs.lanterns) {
    const m = new T.Mesh(new T.PlaneGeometry(2.8, 2.8), new T.MeshBasicMaterial({
      map: TEX.glow, transparent: true, blending: T.AdditiveBlending,
      depthWrite: false, opacity: 0.5, color: 0xffb268
    }));
    m.renderOrder = 4;
    m.frustumCulled = false;
    scene.add(m);
    shipData.glows.push({ mesh: m, local: p.clone() });
  }

  addEventListener('resize', onResize);
  bindControls(canvas);
  onResize();
  animate();
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight, false);
}

/* ---------------------------------------------------------------- */
/* Ship assembly                                                     */
/* ---------------------------------------------------------------- */
function buildShip() {
  const g = new T.Group();
  const trailObjs = { lanterns: [], lights: [] };
  buildHull(g);
  buildCastles(g);
  const mastInfo = buildRig(g, trailObjs);
  buildSails(g, mastInfo);
  buildGunsAndDetail(g, trailObjs);
  return { group: g, trailObjs, glows: [] };
}

/* ---------------------------------------------------------------- */
/* Orbit controls                                                    */
/* ---------------------------------------------------------------- */
function bindControls(el) {
  const onDown = (e) => {
    STATE.dragging = true; STATE.px = e.clientX; STATE.py = e.clientY;
    STATE.velAz = STATE.velEl = 0;
    STATE.lastInputT = STATE.T;
    if (el.setPointerCapture) { try { el.setPointerCapture(e.pointerId); } catch (err) {} }
  };
  const onMove = (e) => {
    if (!STATE.dragging) return;
    const dx = e.clientX - STATE.px, dy = e.clientY - STATE.py;
    STATE.px = e.clientX; STATE.py = e.clientY;
    const k = 0.0052;
    STATE.targetAz -= dx * k;
    STATE.targetEl = clamp(STATE.targetEl + dy * k * 0.8, 0.03, 1.35);
    STATE.velAz = -dx * k; STATE.velEl = dy * k * 0.8;
    STATE.lastInputT = STATE.T;
  };
  const onUp = (e) => { STATE.dragging = false; STATE.lastInputT = STATE.T; };
  el.addEventListener('pointerdown', onDown);
  el.addEventListener('pointermove', onMove);
  el.addEventListener('pointerup', onUp);
  el.addEventListener('pointercancel', onUp);
  el.addEventListener('pointerleave', onUp);
  el.addEventListener('wheel', (e) => {
    e.preventDefault();
    STATE.targetDist = clamp(STATE.targetDist * (1 + Math.sign(e.deltaY) * 0.09), 16, 260);
    STATE.lastInputT = STATE.T;
  }, { passive: false });
  el.addEventListener('contextmenu', (e) => e.preventDefault());
}

/* ---------------------------------------------------------------- */
/* Frame                                                             */
/* ---------------------------------------------------------------- */
const _ws = { y: 0, dx: 0, dz: 0 };
const _dir = new T.Vector2();
const _nrm = new T.Vector3();
const _qTilt = new T.Quaternion();
const _qYaw = new T.Quaternion();
const _qRoll = new T.Quaternion();
const _tmp = new T.Vector3();
const _target = new T.Vector3();

function updateShip(dt) {
  const g = shipData.group;

  // lazy course, wandering a few degrees either side
  const hd = 0.105 * Math.sin(STATE.T * 0.052) + 0.045 * Math.sin(STATE.T * 0.021 + 1.7);
  _dir.set(Math.sin(hd), -Math.cos(hd));
  STATE.travel.addScaledVector(_dir, CFG.shipSpeed * dt);

  const ws = waveSample(STATE.travel.x, STATE.travel.y, STATE.T, _ws);

  // hull rides the swell: damped heave + damped slope
  const heave = ws.y * 0.74;
  STATE.heave = heave;
  const slopeX = ws.dx * 0.62, slopeZ = ws.dz * 0.62;
  _nrm.set(-slopeX, 1, -slopeZ).normalize();

  _qTilt.setFromUnitVectors(WORLD_UP, _nrm);
  _qYaw.setFromAxisAngle(WORLD_UP, -hd);
  const heel = 0.055 + 0.02 * Math.sin(STATE.T * 0.31);
  _qRoll.setFromAxisAngle(new T.Vector3(0, 0, 1), heel);   // mast leans to starboard
  g.quaternion.copy(_qTilt).multiply(_qYaw).multiply(_qRoll);
  g.position.set(0, heave, 0);

  // ---- trail of churned water (phase space) ----------------------
  if (STATE.T - STATE.lastTrailT > 0.55) {
    STATE.lastTrailT = STATE.T;
    STATE.trail.push(new T.Vector2(STATE.travel.x, STATE.travel.y));
    if (STATE.trail.length > TRAIL_N) STATE.trail.shift();
  }

  // ---- ocean uniforms -------------------------------------------
  const u = ocean.material.uniforms;
  u.uTime.value = STATE.T;
  u.uTravel.value.copy(STATE.travel);
  u.uShipPhase.value.copy(STATE.travel);
  u.uShipHeading.value.set(_dir.x, _dir.y);
  const n = STATE.trail.length;
  for (let i = 0; i < TRAIL_N; i++) {
    const slot = u.uTrail.value[i];
    const idx = i - (TRAIL_N - n);
    if (idx < 0) { slot.set(0, 0, 0); continue; }
    const p = STATE.trail[idx];
    const age = idx / Math.max(1, TRAIL_N - 1);
    slot.set(p.x, p.y, Math.pow(age, 1.35) * 0.95);
  }
  u.uWakeStrength.value = 1.0;

  // ---- sails / clouds animation ---------------------------------
  if (MAT.cloth.userData.shader) {
    MAT.cloth.userData.shader.uniforms.uTime.value = STATE.T;
  }
  for (const c of sky.clouds) c.mat.uniforms.uTime.value = STATE.T;

  // ---- lantern glows follow the hull ----------------------------
  g.updateMatrixWorld();
  for (const gl of shipData.glows) {
    gl.mesh.position.copy(gl.local).applyMatrix4(g.matrixWorld);
    gl.mesh.quaternion.copy(camera.quaternion);
  }
  sky.halo.quaternion.copy(camera.quaternion);
}

function updateCamera(dt) {
  // inertia + slow idle drift
  if (!STATE.dragging) {
    STATE.targetAz += STATE.velAz;
    STATE.targetEl = clamp(STATE.targetEl + STATE.velEl, 0.03, 1.35);
    STATE.velAz *= Math.pow(0.0022, dt);
    STATE.velEl *= Math.pow(0.0022, dt);
    const idle = STATE.T - STATE.lastInputT;
    if (idle > 7) STATE.targetAz += 0.017 * dt * smoothstep(7, 16, idle);
  }
  const k = 1 - Math.pow(0.0016, dt);
  STATE.azimuth += (STATE.targetAz - STATE.azimuth) * k;
  STATE.elevation += (STATE.targetEl - STATE.elevation) * k;
  STATE.dist += (STATE.targetDist - STATE.dist) * k;

  _target.set(0, 8.6, -1.5);
  const ce = Math.cos(STATE.elevation), se = Math.sin(STATE.elevation);
  camera.position.set(
    _target.x + Math.sin(STATE.azimuth) * ce * STATE.dist,
    _target.y + se * STATE.dist,
    _target.z + Math.cos(STATE.azimuth) * ce * STATE.dist
  );
  // never dip below the waterline
  if (camera.position.y < 2.2) camera.position.y = 2.2;
  camera.lookAt(_target);
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clockDelta(), 0.05);
  STATE.T += dt;
  updateShip(dt);
  updateCamera(dt);
  renderer.render(scene, camera);
}

let _last = 0;
function clockDelta() {
  const now = performance.now() / 1000;
  if (!_last) { _last = now; return 1 / 60; }
  const d = now - _last;
  _last = now;
  return d;
}

/* ---------------------------------------------------------------- */
init();

</script>
</body>
</html>
