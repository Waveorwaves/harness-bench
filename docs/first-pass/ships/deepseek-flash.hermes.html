<script>
/* =====================================================================
   01_core.js -- configuration, math, procedural textures
   ===================================================================== */
'use strict';

const T = THREE;

/* ---------------------------------------------------------------- */
/* Scene configuration                                               */
/* ---------------------------------------------------------------- */
const CFG = {
  // Sun: low, ahead and to the right of the ship.
  sunDir:      new T.Vector3(0.55, 0.125, -0.83).normalize(),
  sunColor:    new T.Color('#ffb066'),
  sunCore:     new T.Color('#fff0d0'),
  skyTop:      new T.Color('#2d4d7a'),
  skyMid:      new T.Color('#8d7fa6'),
  skyHorizon:  new T.Color('#ffb26b'),
  skyHaze:     new T.Color('#f6a86a'),

  deepColor:   new T.Color('#0b2a3a'),
  shallowCol:  new T.Color('#14485a'),
  foamColor:   new T.Color('#dff0ef'),

  fogColor:    new T.Color('#e8a877'),
  fogDensity:  0.00075,

  shipSpeed:   5.2,          // world units / second
  shipHeading: new T.Vector3(0, 0, -1).normalize(),

  waveScale:   1.0,
  seaState:    1.0
};

/* Gerstner wave train.  len = wavelength, amp = amplitude,
   steep = horizontal steepness, dir = direction, om = angular speed. */
const WAVES = [
  { len: 214, amp: 1.28, steep: 0.40, dir: [ 1.00,  0.20], om: 0.50 },
  { len: 121, amp: 0.82, steep: 0.48, dir: [ 0.72, -0.69], om: 0.66 },
  { len:  69, amp: 0.47, steep: 0.52, dir: [ 1.00,  0.72], om: 0.88 },
  { len:  38, amp: 0.25, steep: 0.58, dir: [ 0.34,  1.00], om: 1.22 },
  { len:  21, amp: 0.135,steep: 0.58, dir: [-0.62,  0.79], om: 1.62 },
  { len:  12, amp: 0.072,steep: 0.50, dir: [ 1.00, -0.28], om: 2.10 },
  { len: 6.6, amp: 0.036,steep: 0.46, dir: [ 0.22,  1.00], om: 2.85 }
];
(function prepWaves(){
  for (const w of WAVES) {
    const l = Math.hypot(w.dir[0], w.dir[1]);
    w.dir[0] /= l; w.dir[1] /= l;
    w.k = 2 * Math.PI / w.len;
    w.amp *= CFG.seaState;
  }
})();
const MAX_WAVES = 7;

/* ---------------------------------------------------------------- */
/* Gerstner field, mirrored on the CPU for ship buoyancy             */
/* ---------------------------------------------------------------- */
/* sample: returns height and slope of the *base* surface at (x,z)   */
const _wf = { y: 0, dx: 0, dz: 0 };
function waveSample(x, z, t, out) {
  out = out || _wf;
  let y = 0, dx = 0, dz = 0;
  for (let i = 0; i < WAVES.length; i++) {
    const w = WAVES[i];
    const ph = w.k * (w.dir[0] * x + w.dir[1] * z) - w.om * t;
    const c = Math.cos(ph), s = Math.sin(ph);
    y  += w.amp * s;
    dx += w.amp * w.k * w.dir[0] * c;
    dz += w.amp * w.k * w.dir[1] * c;
  }
  out.y = y; out.dx = dx; out.dz = dz;
  return out;
}

/* ---------------------------------------------------------------- */
/* Small helpers                                                     */
/* ---------------------------------------------------------------- */
let _seed = 20260707;
function rnd() { _seed = (_seed * 1664525 + 1013904223) & 0x7fffffff; return _seed / 0x7fffffff; }
function rr(a, b) { return a + (b - a) * rnd(); }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
function smoothstep(e0, e1, x) { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); }

function newCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}
function texFromCanvas(cv, repX, repY, srgb) {
  const tx = new T.CanvasTexture(cv);
  tx.wrapS = tx.wrapT = T.RepeatWrapping;
  tx.repeat.set(repX || 1, repY || 1);
  tx.anisotropy = 8;
  if (srgb === false) tx.colorSpace = T.NoColorSpace; else tx.colorSpace = T.SRGBColorSpace;
  return tx;
}
function noise2(x, y) {
  const s = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
  return s - Math.floor(s);
}
function fbm2(x, y, oct) {
  let a = 0.5, f = 1, v = 0, n = 0;
  for (let i = 0; i < (oct || 4); i++) { v += a * noise2(x * f, y * f); n += a; a *= 0.5; f *= 2.03; }
  return v / n;
}

/* ---------------------------------------------------------------- */
/* Procedural textures                                               */
/* ---------------------------------------------------------------- */
const TEX = {};

/* Hull planking: dark oak boards with caulking, grain and trenails. */
function makeWoodTexture() {
  const S = 1024, cv = newCanvas(S, S), g = cv.getContext('2d');
  const bump = newCanvas(S, S), bg = bump.getContext('2d');
  // base boards
  g.fillStyle = '#4b3625'; g.fillRect(0, 0, S, S);
  bg.fillStyle = '#808080'; bg.fillRect(0, 0, S, S);
  const rows = 16, rh = S / rows;
  for (let r = 0; r < rows; r++) {
    const y = r * rh;
    // per-plank base tone
    const t = rr(0.72, 1.18);
    const base = [Math.floor(126 * t), Math.floor(92 * t), Math.floor(62 * t)];
    g.fillStyle = `rgb(${base[0]},${base[1]},${base[2]})`;
    g.fillRect(0, y, S, rh - 2);
    // grain streaks
    for (let k = 0; k < 26; k++) {
      const gy = y + rr(1, rh - 2);
      const gl = rr(0.35, 1.0);
      const dark = rr(0.35, 0.8);
      g.strokeStyle = `rgba(${Math.floor(base[0] * dark)},${Math.floor(base[1] * dark)},${Math.floor(base[2] * dark)},${rr(0.25, 0.7)})`;
      g.lineWidth = rr(0.6, 2.4);
      g.beginPath();
      g.moveTo(-10, gy);
      for (let x = 0; x <= S + 10; x += 32) {
        g.lineTo(x, gy + Math.sin(x * 0.012 + k * 3.1 + r) * 2.4 * gl + rr(-1, 1));
      }
      g.stroke();
      // bump: grain grooves are lower
      bg.strokeStyle = `rgba(${Math.floor(120 + 90 * dark)},${0},0,${rr(0.2, 0.5)})`;
      bg.lineWidth = rr(0.6, 2.0);
      bg.beginPath(); bg.moveTo(-10, gy);
      for (let x = 0; x <= S + 10; x += 32) bg.lineTo(x, gy + Math.sin(x * 0.012 + k * 3.1 + r) * 2.4 * gl + rr(-1, 1));
      bg.stroke();
    }
    // plank highlight (top edge) + caulk line (bottom)
    g.fillStyle = 'rgba(255,225,190,0.07)';
    g.fillRect(0, y, S, 2);
    g.fillStyle = 'rgba(8,5,4,0.85)';
    g.fillRect(0, y + rh - 3, S, 3);
    bg.fillStyle = 'rgba(0,0,0,1)';
    bg.fillRect(0, y + rh - 3, S, 3);
    // trenails
    const step = rr(60, 110);
    for (let x = step * 0.5; x < S; x += step) {
      g.beginPath(); g.arc(x, y + rh * 0.5, rr(1.4, 2.4), 0, 6.283);
      g.fillStyle = `rgba(${Math.floor(base[0] * 0.55)},${Math.floor(base[1] * 0.5)},${Math.floor(base[2] * 0.45)},0.75)`;
      g.fill();
      g.strokeStyle = 'rgba(255,220,180,0.10)'; g.lineWidth = 0.8; g.stroke();
    }
  }
  // grime / value blotches
  for (let i = 0; i < 340; i++) {
    const x = rr(0, S), y = rr(0, S), r = rr(12, 90);
    const grd = g.createRadialGradient(x, y, 0, x, y, r);
    const dark = rnd() > 0.5;
    grd.addColorStop(0, dark ? `rgba(14,9,7,${rr(0.03, 0.12)})` : `rgba(200,170,120,${rr(0.02, 0.07)})`);
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grd; g.beginPath(); g.arc(x, y, r, 0, 6.283); g.fill();
  }
  TEX.wood = texFromCanvas(cv, 3, 3);
  TEX.woodBump = texFromCanvas(bump, 3, 3, false);
}

/* Deck: pale weathered planks running lengthwise with caulking. */
function makeDeckTexture() {
  const S = 1024, cv = newCanvas(S, S), g = cv.getContext('2d');
  g.fillStyle = '#6d5b43'; g.fillRect(0, 0, S, S);
  const rows = 11, rh = S / rows;
  for (let r = 0; r < rows; r++) {
    const y = r * rh, t = rr(0.82, 1.16);
    g.fillStyle = `rgb(${Math.floor(120 * t)},${Math.floor(101 * t)},${Math.floor(74 * t)})`;
    g.fillRect(0, y, S, rh - 2);
    for (let k = 0; k < 30; k++) {
      const gy = y + rr(1, rh - 2);
      g.strokeStyle = `rgba(${Math.floor(70 * rr(0.6, 1))},${Math.floor(58 * rr(0.6, 1))},${Math.floor(42 * rr(0.6, 1))},${rr(0.12, 0.4)})`;
      g.lineWidth = rr(0.5, 1.8);
      g.beginPath(); g.moveTo(-10, gy);
      for (let x = 0; x <= S + 10; x += 48) g.lineTo(x, gy + Math.sin(x * 0.008 + k * 2.3 + r * 1.7) * 2.2 + rr(-0.8, 0.8));
      g.stroke();
    }
    g.fillStyle = 'rgba(255,240,210,0.06)'; g.fillRect(0, y, S, 2);
    g.fillStyle = 'rgba(24,17,12,0.9)'; g.fillRect(0, y + rh - 3, S, 3);
    // butt joints
    for (let x = rr(0, 300); x < S; x += rr(320, 520)) {
      g.fillStyle = 'rgba(24,17,12,0.75)'; g.fillRect(x, y, 3, rh - 2);
    }
    for (let x = rr(20, 90); x < S; x += rr(70, 130)) {
      g.beginPath(); g.arc(x, y + rh * 0.5, rr(1.2, 2.0), 0, 6.283);
      g.fillStyle = 'rgba(40,30,22,0.55)'; g.fill();
    }
  }
  for (let i = 0; i < 300; i++) {
    const x = rr(0, S), y = rr(0, S), r = rr(10, 70);
    const grd = g.createRadialGradient(x, y, 0, x, y, r);
    grd.addColorStop(0, rnd() > 0.5 ? `rgba(60,50,40,${rr(0.02, 0.1)})` : `rgba(230,215,180,${rr(0.02, 0.08)})`);
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grd; g.beginPath(); g.arc(x, y, r, 0, 6.283); g.fill();
  }
  TEX.deck = texFromCanvas(cv, 2, 12);
}

/* Sail cloth: cream, woven, with horizontal seams and reef bands. */
function makeSailTexture() {
  const S = 512, cv = newCanvas(S, S), g = cv.getContext('2d');
  g.fillStyle = '#e8dcc0'; g.fillRect(0, 0, S, S);
  // weave
  const img = g.getImageData(0, 0, S, S), d = img.data;
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const i = (y * S + x) * 4;
    const w = (Math.sin(x * 1.5) * Math.sin(y * 1.5)) * 7 + (noise2(x * 0.7, y * 0.7) - 0.5) * 16;
    d[i] = clamp(d[i] + w, 0, 255); d[i + 1] = clamp(d[i + 1] + w, 0, 255); d[i + 2] = clamp(d[i + 2] + w * 1.05, 0, 255);
  }
  g.putImageData(img, 0, 0);
  // cloth seams
  for (let y = 30; y < S; y += 62) {
    g.fillStyle = 'rgba(150,132,100,0.35)'; g.fillRect(0, y, S, 4);
    g.fillStyle = 'rgba(255,250,235,0.25)'; g.fillRect(0, y - 2, S, 2);
    g.strokeStyle = 'rgba(120,102,74,0.30)'; g.lineWidth = 1;
    g.beginPath();
    for (let x = 0; x < S; x += 9) g.lineTo(x, y + 2);
    g.stroke();
  }
  for (let i = 0; i < 240; i++) {
    const x = rr(0, S), y = rr(0, S), r = rr(6, 46);
    const grd = g.createRadialGradient(x, y, 0, x, y, r);
    grd.addColorStop(0, rnd() > 0.6 ? `rgba(120,100,70,${rr(0.02, 0.09)})` : `rgba(255,252,240,${rr(0.02, 0.09)})`);
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grd; g.beginPath(); g.arc(x, y, r, 0, 6.283); g.fill();
  }
  TEX.sail = texFromCanvas(cv, 1, 1);
}

/* Cloud puff (alpha). */
function makeCloudTexture() {
  const S = 256, cv = newCanvas(S, S), g = cv.getContext('2d');
  g.clearRect(0, 0, S, S);
  const puffs = 26;
  for (let i = 0; i < puffs; i++) {
    const a = (i / puffs) * Math.PI * 2 + rr(-0.2, 0.2);
    const rad = rr(0, 0.40);
    const x = S / 2 + Math.cos(a) * S * rad * rr(0.7, 1.3);
    const y = S / 2 + Math.sin(a) * S * rad * 0.42 * rr(0.6, 1.2);
    const r = rr(S * 0.07, S * 0.20);
    const grd = g.createRadialGradient(x, y, 0, x, y, r);
    grd.addColorStop(0, `rgba(255,255,255,${rr(0.28, 0.5)})`);
    grd.addColorStop(0.45, `rgba(255,255,255,${rr(0.1, 0.22)})`);
    grd.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = grd; g.beginPath(); g.arc(x, y, r, 0, 6.283); g.fill();
  }
  TEX.cloud = texFromCanvas(cv, 1, 1);
  TEX.cloud.wrapS = TEX.cloud.wrapT = T.ClampToEdgeWrapping;
}

/* Radial glow for lanterns / sun halo. */
function makeGlowTexture() {
  const S = 128, cv = newCanvas(S, S), g = cv.getContext('2d');
  const grd = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  grd.addColorStop(0.0, 'rgba(255,255,255,1)');
  grd.addColorStop(0.18, 'rgba(255,236,196,0.72)');
  grd.addColorStop(0.45, 'rgba(255,190,120,0.22)');
  grd.addColorStop(1.0, 'rgba(255,160,90,0)');
  g.fillStyle = grd; g.fillRect(0, 0, S, S);
  TEX.glow = texFromCanvas(cv, 1, 1);
  TEX.glow.wrapS = TEX.glow.wrapT = T.ClampToEdgeWrapping;
}

function buildTextures() {
  makeWoodTexture();
  makeDeckTexture();
  makeSailTexture();
  makeCloudTexture();
  makeGlowTexture();
}
/* =====================================================================
   02_ocean.js -- shared sky GLSL, ocean geometry, water shader
   ===================================================================== */

/* ---------------------------------------------------------------- */
/* Shared GLSL: procedural sunset sky, sampled by sky dome + water   */
/* reflection so the two always agree.                               */
/* ---------------------------------------------------------------- */
const GLSL_SKY = `
uniform vec3 uSunDir;
uniform vec3 uSunColor;
uniform vec3 uSunCore;
uniform vec3 uSkyTop;
uniform vec3 uSkyMid;
uniform vec3 uSkyHorizon;
uniform vec3 uSkyHaze;

vec3 skyColor(vec3 dir){
  dir = normalize(dir);
  float up = clamp(dir.y, 0.0, 1.0);
  vec3 col = mix(uSkyHorizon, uSkyMid, smoothstep(0.0, 0.30, up));
  col = mix(col, uSkyTop, smoothstep(0.10, 0.80, up));

  float cs = clamp(dot(dir, uSunDir), -1.0, 1.0);
  vec3 hdir  = normalize(vec3(dir.x, 0.0, dir.z) + 1e-5);
  vec3 hsdir = normalize(vec3(uSunDir.x, 0.0, uSunDir.z) + 1e-5);
  float sunAz = max(dot(hdir, hsdir), 0.0);

  // warm haze hugging the horizon, strongest towards the sun
  float haze = pow(1.0 - up, 7.0);
  col = mix(col, uSkyHaze, haze * (0.35 + 0.45 * pow(sunAz, 2.0)));

  // broad mie scatter around the sun
  col += uSunColor * pow(max(cs, 0.0), 7.0)  * 0.30;
  col += uSunColor * pow(max(cs, 0.0), 2.0)  * 0.075;

  // sun disc + tight glow (angular, numerically stable)
  float ang = acos(clamp(cs, -1.0, 1.0));
  col += uSunCore * (1.0 - smoothstep(0.0055, 0.0115, ang)) * 9.0;
  col += uSunColor * (exp(-ang * 26.0) * 1.1 + exp(-ang * 5.0) * 0.16);

  // below the horizon the dome fades into haze
  col = mix(col, uSkyHaze * 0.62, smoothstep(0.0, -0.20, dir.y));
  return col;
}
`;

/* Cheap hash noise (used for foam break-up and micro normals). */
const GLSL_NOISE = `
float hash21(vec2 p){ p = fract(p * vec2(127.1, 311.7)); p += dot(p, p + 34.7); return fract(p.x * p.y); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float a = hash21(i), b = hash21(i + vec2(1.0, 0.0));
  float c = hash21(i + vec2(0.0, 1.0)), d = hash21(i + vec2(1.0, 1.0));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}
`;

/* ---------------------------------------------------------------- */
/* Uniform block shared by sky / ocean / clouds                      */
/* ---------------------------------------------------------------- */
const SKY_UNIFORMS = {
  uSunDir:     { value: CFG.sunDir },
  uSunColor:   { value: CFG.sunColor.clone().multiplyScalar(1.0) },
  uSunCore:    { value: CFG.sunCore.clone() },
  uSkyTop:     { value: CFG.skyTop.clone() },
  uSkyMid:     { value: CFG.skyMid.clone() },
  uSkyHorizon: { value: CFG.skyHorizon.clone() },
  uSkyHaze:    { value: CFG.skyHaze.clone() }
};
function cloneSkyUniforms() {
  const o = {};
  for (const k in SKY_UNIFORMS) o[k] = { value: SKY_UNIFORMS[k].value.clone ? SKY_UNIFORMS[k].value.clone() : SKY_UNIFORMS[k].value };
  return o;
}

/* ---------------------------------------------------------------- */
/* Ocean geometry: dense uniform centre grid + watertight outer ring */
/* ---------------------------------------------------------------- */
const OCEAN = {
  S: 84,          // half-size of the dense inner square
  N: 280,         // segments across it
  layers: 34,     // rings of the outer skirt
  outer: 4600     // radius of the outer square
};

function buildNearGrid() {
  const N = OCEAN.N, S = OCEAN.S, step = (2 * S) / N;
  const n1 = N + 1;
  const pos = new Float32Array(n1 * n1 * 3);
  let p = 0;
  for (let j = 0; j < n1; j++) {
    const z = -S + j * step;
    for (let i = 0; i < n1; i++) {
      pos[p++] = -S + i * step; pos[p++] = 0; pos[p++] = z;
    }
  }
  const idx = new Uint32Array(N * N * 6);
  let q = 0;
  for (let j = 0; j < N; j++) {
    for (let i = 0; i < N; i++) {
      const a = j * n1 + i, b = a + 1, c = a + n1, d = c + 1;
      idx[q++] = a; idx[q++] = c; idx[q++] = b;
      idx[q++] = b; idx[q++] = c; idx[q++] = d;
    }
  }
  const g = new T.BufferGeometry();
  g.setAttribute('position', new T.BufferAttribute(pos, 3));
  g.setIndex(new T.BufferAttribute(idx, 1));
  g.boundingSphere = new T.Sphere(new T.Vector3(0, 0, 0), S * 1.5);
  return g;
}

/* Perimeter of the inner square, CCW, used as the skirt's base ring. */
function innerPerimeter() {
  const N = OCEAN.N, S = OCEAN.S, step = (2 * S) / N;
  const pts = [];
  for (let i = 0; i < N; i++) pts.push([-S + i * step, -S]);       // bottom
  for (let i = 0; i < N; i++) pts.push([S, -S + i * step]);        // right
  for (let i = 0; i < N; i++) pts.push([S - i * step, S]);         // top
  for (let i = 0; i < N; i++) pts.push([-S, S - i * step]);        // left
  return pts;
}

function buildSkirt() {
  const base = innerPerimeter(), P = base.length, M = OCEAN.layers;
  const sMax = OCEAN.outer / OCEAN.S;
  const pos = new Float32Array(P * M * 3);
  let p = 0;
  for (let k = 0; k < M; k++) {
    const s = Math.pow(sMax, k / (M - 1));
    for (let i = 0; i < P; i++) {
      pos[p++] = base[i][0] * s; pos[p++] = 0; pos[p++] = base[i][1] * s;
    }
  }
  const idx = new Uint32Array(P * (M - 1) * 6);
  let q = 0;
  for (let k = 0; k < M - 1; k++) {
    for (let i = 0; i < P; i++) {
      const i2 = (i + 1) % P;
      const a = k * P + i, b = k * P + i2, c = (k + 1) * P + i, d = (k + 1) * P + i2;
      idx[q++] = a; idx[q++] = c; idx[q++] = b;
      idx[q++] = b; idx[q++] = c; idx[q++] = d;
    }
  }
  const g = new T.BufferGeometry();
  g.setAttribute('position', new T.BufferAttribute(pos, 3));
  g.setIndex(new T.BufferAttribute(idx, 1));
  g.boundingSphere = new T.Sphere(new T.Vector3(0, 0, 0), OCEAN.outer * 1.5);
  return g;
}

/* ---------------------------------------------------------------- */
/* Water shader                                                      */
/* ---------------------------------------------------------------- */
const TRAIL_N = 30;

const waterVert = `
precision highp float;
uniform float uTime;
uniform vec2  uTravel;
uniform vec2  uShipPhase;
uniform vec2  uShipHeading;
uniform vec4  uWaves[${MAX_WAVES}];      // x=dirx y=dirz z=amp w=k
uniform vec4  uWaveB[${MAX_WAVES}];      // x=steep y=omega
uniform vec3  uTrail[${TRAIL_N}];        // xy = phase-space pos, z = strength
uniform float uWakeStrength;
uniform float uMaxAmp;

varying vec3  vWorld;      // local space position (mesh space)
varying vec3  vNormal;
varying float vFoam;
varying float vCrest;
varying float vHeight;

${GLSL_NOISE}

void gerstner(vec2 p, out vec3 disp, out vec3 nrm){
  float dxdx = 1.0, dydx = 0.0, dzdx = 0.0;
  float dxdz = 0.0, dydz = 0.0, dzdz = 1.0;
  vec3 d = vec3(0.0);
  for (int i = 0; i < ${MAX_WAVES}; i++){
    vec4 W  = uWaves[i];
    float k = W.w;
    float amp = W.z;
    float steep = uWaveB[i].x;
    float om = uWaveB[i].y;
    float ph = k * dot(W.xy, p) - om * uTime;
    float c = cos(ph), s = sin(ph);
    d.y  += amp * s;
    d.xz += steep * amp * W.xy * c;
    float q = amp * k;
    dxdx -= steep * q * W.x * W.x * s;
    dzdx -= steep * q * W.y * W.x * s;
    dydx += q * W.x * c;
    dxdz -= steep * q * W.x * W.y * s;
    dzdz -= steep * q * W.y * W.y * s;
    dydz += q * W.y * c;
  }
  disp = d;
  nrm = normalize(cross(vec3(dxdz, dydz, dzdz), vec3(dxdx, dydx, dzdx)));
}

/* foam laid down by the ship: churned trail + bow/stern disturbance */
float wakeMask(vec2 p){
  float f = 0.0;
  for (int i = 0; i < ${TRAIL_N - 1}; i++){
    vec2 a = uTrail[i].xy, b = uTrail[i + 1].xy;
    float s = uTrail[i].z;
    if (s <= 0.001) continue;
    vec2 pa = p - a, ba = b - a;
    float h = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-4), 0.0, 1.0);
    float dist = length(pa - ba * h);
    float w = mix(15.0, 2.4, s);
    f += s * exp(-pow(dist / w, 2.0) * 1.35);
  }
  vec2 rel = p - uShipPhase;
  float along = dot(rel, uShipHeading);
  float lat   = dot(rel, vec2(-uShipHeading.y, uShipHeading.x));

  // bow wave pushed up around the stem
  float bow  = exp(-pow((along - 4.0) / 11.0, 2.0)) * exp(-pow(lat / 6.5, 2.0));
  float stern= exp(-pow((along + 16.0) / 16.0, 2.0)) * exp(-pow(lat / 9.0, 2.0));
  float mid  = exp(-pow(along / 26.0, 2.0)) * exp(-pow((abs(lat) - 7.6) / 3.0, 2.0));

  // diverging Kelvin arms from the bow
  float t2 = -along + 26.0;
  float armW = 1.6 + 0.075 * t2;
  float arms = exp(-pow((abs(lat) - 0.36 * t2) / armW, 2.0));
  arms *= smoothstep(0.0, 22.0, t2) * exp(-t2 / 210.0) * 0.85;

  return f * 0.95 + bow * 1.15 + stern * 0.75 + mid * 0.35 + arms;
}

void main(){
  vec2 p = position.xz + uTravel;

  vec3 disp, n;
  gerstner(p, disp, n);

  vec3 local = vec3(position.x + disp.x, disp.y, position.z + disp.z);

  // wake foam (phase space, so it stays pinned to the sea)
  float wake = wakeMask(p);
  float wob = vnoise(p * 0.55 + vec2(uTime * 0.35, -uTime * 0.22));
  wake *= mix(0.55, 1.25, wob);
  wake *= uWakeStrength;

  // crest foam from steepness + height
  float crest = smoothstep(0.55, 0.95, disp.y / uMaxAmp);
  float steepN = 1.0 - n.y;
  float whitec = smoothstep(0.16, 0.40, steepN) * smoothstep(0.35, 0.85, crest + 0.25);

  vFoam = clamp(max(wake, max(whitec * 0.9, wake * 1.2)), 0.0, 1.6);
  vCrest = crest * whitec;
  vHeight = disp.y;
  vNormal = n;
  vWorld = local;
  gl_Position = projectionMatrix * viewMatrix * vec4(local, 1.0);
}
`;

const waterFrag = `
precision highp float;
uniform float uTime;
uniform vec2  uTravel;
uniform float uMaxAmp;
uniform vec3  uDeep;
uniform vec3  uShallow;
uniform vec3  uFoamCol;
uniform vec3  uFogCol;
uniform float uFogDensity;
uniform vec2  uShipPhase;
uniform float uWakeStrength;

varying vec3  vWorld;
varying vec3  vNormal;
varying float vFoam;
varying float vCrest;
varying float vHeight;

${GLSL_NOISE}
${GLSL_SKY}

void main(){
  vec3 N = normalize(vNormal);
  vec3 V = normalize(cameraPosition - vWorld);
  float dist = length(cameraPosition - vWorld);

  // micro detail: two octaves of animated noise perturbing the normal
  vec2 q = vWorld.xz;
  float t1 = uTime * 0.55;
  vec2 o1 = vec2(t1 * 0.31, -t1 * 0.22);
  float s1 = 0.75;
  float h0 = vnoise(q * s1 + o1);
  float hx = vnoise(q * s1 + o1 + vec2(0.16, 0.0));
  float hz = vnoise(q * s1 + o1 + vec2(0.0, 0.16));
  vec2 o2 = vec2(-t1 * 0.6, t1 * 0.42);
  float s2 = 2.3;
  float g0 = vnoise(q * s2 + o2);
  float gx = vnoise(q * s2 + o2 + vec2(0.11, 0.0));
  float gz = vnoise(q * s2 + o2 + vec2(0.0, 0.11));
  vec2 slope = vec2(hx - h0, hz - h0) * 1.25 + vec2(gx - g0, gz - g0) * 0.42;
  float fade = 1.0 - smoothstep(60.0, 420.0, dist);   // no shimmer at range
  N = normalize(N + vec3(-slope.x, 0.0, -slope.y) * fade);
  N = normalize(mix(N, normalize(vNormal), 0.25));

  // ---- reflection -------------------------------------------------
  vec3 R = reflect(-V, N);
  vec3 refl = skyColor(vec3(R.x, max(R.y, 0.002), R.z));
  float fres = 0.02 + 0.98 * pow(1.0 - clamp(dot(N, V), 0.0, 1.0), 5.0);
  fres = clamp(fres * 1.06, 0.0, 1.0);

  // ---- body of water ---------------------------------------------
  float hn = clamp(vHeight / (uMaxAmp * 1.2), -1.0, 1.0);
  vec3 body = mix(uDeep, uShallow, smoothstep(-0.2, 0.9, hn) * 0.75);

  // light bleeding through the back of the waves (sunset translucency)
  vec3 backDir = normalize(vec3(-uSunDir.x, 0.10, -uSunDir.z));
  float back = pow(max(dot(V, backDir), 0.0), 2.6);
  float transmit = back * smoothstep(-0.6, 1.0, hn) * (0.35 + 0.65 * max(dot(N, uSunDir), 0.0));
  body += uSunColor * transmit * 0.95;

  vec3 col = mix(body, refl, fres);

  // ---- sun glitter ------------------------------------------------
  vec3 H = normalize(V + uSunDir);
  float ndh = max(dot(N, H), 0.0);
  float spec = pow(ndh, 420.0) * 3.4 + pow(ndh, 90.0) * 0.30 + pow(ndh, 26.0) * 0.06;
  col += uSunCore * spec * 1.5;
  // wide sheen along the sun path
  float path = pow(max(dot(normalize(vec3(V.x, 0.0, V.z)), -normalize(vec3(uSunDir.x, 0.0, uSunDir.z))), 0.0), 3.0);
  col += uSunColor * path * 0.05 * smoothstep(0.35, 0.95, hn + 0.35);

  // ---- foam -------------------------------------------------------
  float fnoise = vnoise(vWorld.xz * 0.9 + vec2(uTime * 0.25, uTime * -0.18));
  fnoise = fnoise * 0.7 + 0.3 * vnoise(vWorld.xz * 2.7 - vec2(uTime * 0.4, uTime * 0.3));
  float foam = clamp((vFoam - 0.45) * 1.9, 0.0, 1.0);
  foam *= mix(0.55, 1.15, fnoise);
  foam = clamp(foam, 0.0, 1.0);
  float foamLit = 0.55 + 0.65 * max(dot(N, uSunDir), 0.0) + 0.25 * fres;
  col = mix(col, uFoamCol * foamLit, foam * 0.85);
  col += uSunColor * vCrest * 0.10;

  // ---- atmosphere --------------------------------------------------
  vec3 dir = normalize(vWorld - cameraPosition);
  vec3 fogTo = skyColor(vec3(dir.x, max(dir.y, 0.0) * 0.7 + 0.004, dir.z));
  float fd = 1.0 - exp(-pow(dist * uFogDensity, 2.0));
  col = mix(col, fogTo, clamp(fd, 0.0, 1.0));
  float graze = 1.0 - clamp(dot(N, V), 0.0, 1.0);
  col = mix(col, fogTo, smoothstep(0.55, 1.0, graze) * 0.35 * smoothstep(80.0, 1400.0, dist));

  gl_FragColor = vec4(col, 1.0);
  #include <tonemapping_fragment>
  #include <colorspace_fragment>
}
`;

function makeOceanMaterial() {
  const u = Object.assign(cloneSkyUniforms(), {
    uTime:        { value: 0 },
    uTravel:      { value: new T.Vector2(0, 0) },
    uShipPhase:   { value: new T.Vector2(0, 0) },
    uShipHeading: { value: new T.Vector2(0, -1) },
    uWaves:       { value: [] },
    uWaveB:       { value: [] },
    uTrail:       { value: [] },
    uWakeStrength:{ value: 1.0 },
    uMaxAmp:      { value: 2.9 },
    uDeep:        { value: CFG.deepColor.clone() },
    uShallow:     { value: CFG.shallowCol.clone() },
    uFoamCol:     { value: CFG.foamColor.clone() },
    uFogCol:      { value: CFG.fogColor.clone() },
    uFogDensity:  { value: CFG.fogDensity }
  });
  let maxAmp = 0;
  for (let i = 0; i < MAX_WAVES; i++) {
    const w = WAVES[i] || WAVES[WAVES.length - 1];
    u.uWaves.value.push(new T.Vector4(w.dir[0], w.dir[1], i < WAVES.length ? w.amp : 0, i < WAVES.length ? w.k : 1));
    u.uWaveB.value.push(new T.Vector4(w.steep, w.om, 0, 0));
    maxAmp += (i < WAVES.length ? w.amp : 0);
  }
  u.uMaxAmp.value = maxAmp * 0.82;
  for (let i = 0; i < TRAIL_N; i++) u.uTrail.value.push(new T.Vector3(0, 0, 0));

  const m = new T.ShaderMaterial({
    uniforms: u,
    vertexShader: waterVert,
    fragmentShader: waterFrag,
    side: T.FrontSide
  });
  m.toneMapped = true;
  return m;
}

function buildOcean(scene) {
  const mat = makeOceanMaterial();
  const near = new T.Mesh(buildNearGrid(), mat);
  const skirt = new T.Mesh(buildSkirt(), mat);
  near.frustumCulled = false;
  skirt.frustumCulled = false;
  near.renderOrder = 0; skirt.renderOrder = 0;
  scene.add(near); scene.add(skirt);
  return { material: mat, near, skirt };
}
/* =====================================================================
   03_sky.js -- sunset dome, cloud cards, sun halo
   ===================================================================== */

const skyVert = `
varying vec3 vDir;
void main(){
  vDir = position;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
}
`;

const skyFrag = `
precision highp float;
varying vec3 vDir;
${GLSL_SKY}
void main(){
  vec3 col = skyColor(vDir);
  gl_FragColor = vec4(col, 1.0);
  #include <tonemapping_fragment>
  #include <colorspace_fragment>
}
`;

function buildSky(scene) {
  const geo = new T.SphereGeometry(9000, 48, 32);
  const mat = new T.ShaderMaterial({
    uniforms: cloneSkyUniforms(),
    vertexShader: skyVert,
    fragmentShader: skyFrag,
    side: T.BackSide,
    depthWrite: false,
    fog: false
  });
  mat.toneMapped = true;
  const dome = new T.Mesh(geo, mat);
  dome.frustumCulled = false;
  dome.renderOrder = -1000;
  scene.add(dome);

  /* ---------------- clouds ---------------- */
  const cloudVert = `
    varying vec2 vUv;
    varying vec3 vWorld;
    void main(){
      vUv = uv;
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorld = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `;
  const cloudFrag = `
    precision highp float;
    uniform sampler2D uMap;
    uniform float uOpacity;
    uniform float uSeed;
    uniform float uTime;
    varying vec2 vUv;
    varying vec3 vWorld;
    ${GLSL_SKY}
    void main(){
      vec4 tx = texture2D(uMap, vUv + vec2(uTime * 0.0022 * uSeed, 0.0));
      if (tx.a < 0.004) discard;
      vec3 dir = normalize(vWorld);
      float cs = clamp(dot(dir, uSunDir), 0.0, 1.0);
      vec3 shade = mix(uSkyTop * 0.85, uSkyMid * 0.95, 0.45);
      vec3 lit   = mix(uSkyHorizon * 1.05, uSunColor * 1.25, 0.55);
      vec3 col = mix(shade, lit, pow(cs, 2.0));
      col += uSunColor * pow(cs, 9.0) * 0.9;             // gilded edge
      col = mix(col, skyColor(dir), 0.22);
      float a = tx.a * uOpacity;
      a *= smoothstep(0.0, 0.16, vUv.y) * smoothstep(1.0, 0.80, vUv.y);  // soften top/bottom
      gl_FragColor = vec4(col, a);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }
  `;

  const clouds = [];
  const cloudDefs = [];
  // a band of cloud sitting on the sunset horizon, weighted towards the sun
  for (let i = 0; i < 16; i++) {
    const az = rr(-Math.PI * 1.15, Math.PI * 1.15);
    const dist = rr(2600, 6200);
    const el = rr(0.035, 0.30);
    const size = rr(900, 2400);
    cloudDefs.push({ az, dist, el, size, op: rr(0.32, 0.72), seed: rr(0.5, 2.0), squash: rr(0.32, 0.5) });
  }
  const sunAz = Math.atan2(CFG.sunDir.x, -CFG.sunDir.z);
  for (let i = 0; i < 3; i++) {          // extra warm banks right by the sun
    cloudDefs.push({ az: sunAz + rr(-0.45, 0.45), dist: rr(2200, 3400), el: rr(0.02, 0.09),
                     size: rr(1200, 2600), op: rr(0.4, 0.7), seed: rr(0.5, 2.0), squash: rr(0.22, 0.38) });
  }

  for (const d of cloudDefs) {
    const mat2 = new T.ShaderMaterial({
      uniforms: Object.assign(cloneSkyUniforms(), {
        uMap: { value: TEX.cloud }, uOpacity: { value: d.op },
        uSeed: { value: d.seed }, uTime: { value: 0 }
      }),
      vertexShader: cloudVert, fragmentShader: cloudFrag,
      transparent: true, depthWrite: false, side: T.DoubleSide, fog: false
    });
    mat2.toneMapped = true;
    const m = new T.Mesh(new T.PlaneGeometry(d.size, d.size * d.squash), mat2);
    m.position.set(Math.sin(d.az) * d.dist, d.el * d.dist * 1.4, -Math.cos(d.az) * d.dist);
    m.rotation.z = rr(-0.06, 0.06);
    m.renderOrder = 5;
    scene.add(m);
    clouds.push({ mesh: m, mat: mat2, baseY: m.position.y, seed: d.seed, size: d.size });
  }

  /* ---------------- sun halo ---------------- */
  const haloMat = new T.ShaderMaterial({
    uniforms: Object.assign(cloneSkyUniforms(), { uMap: { value: TEX.glow }, uStrength: { value: 0.42 } }),
    vertexShader: `
      varying vec2 vUv; varying vec3 vWorld;
      void main(){ vUv = uv; vec4 wp = modelMatrix * vec4(position,1.0); vWorld = wp.xyz;
        gl_Position = projectionMatrix * viewMatrix * wp; }`,
    fragmentShader: `
      precision highp float;
      uniform sampler2D uMap; uniform float uStrength;
      varying vec2 vUv; varying vec3 vWorld;
      ${GLSL_SKY}
      void main(){
        float a = texture2D(uMap, vUv).a;
        vec3 dir = normalize(vWorld);
        float cs = clamp(dot(dir, uSunDir), 0.0, 1.0);
        vec3 col = mix(uSunColor, uSunCore, pow(cs, 3.0));
        gl_FragColor = vec4(col, a * uStrength);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`,
    transparent: true, depthWrite: false, blending: T.AdditiveBlending, fog: false
  });
  haloMat.toneMapped = true;
  const halo = new T.Mesh(new T.PlaneGeometry(1700, 1700), haloMat);
  halo.position.copy(CFG.sunDir).multiplyScalar(7200);
  halo.renderOrder = 6;
  halo.frustumCulled = false;
  scene.add(halo);

  return { dome, mat, clouds, halo, haloMat };
}

/* ---------------------------------------------------------------- */
/* Material library                                                  */
/* ---------------------------------------------------------------- */
const MAT = {};

function buildShipMaterials() {

    map: TEX.wood, bumpMap: TEX.woodBump, bumpScale: 0.03,

  MAT.deck = new T.MeshStandardMaterial({

  });
  MAT.spar = new T.MeshStandardMaterial({
    map: TEX.deck, color: 0xbda882, roughness: 0.85, metalness: 0.0
  });
  MAT.trim = new T.MeshStandardMaterial({
    map: TEX.wood, color: 0x8a6a48, roughness: 0.8, metalness: 0.0
  });
  MAT.paint = new T.MeshStandardMaterial({ color: 0x7e2f26, roughness: 0.72, metalness: 0.0 });
  MAT.paintGold = new T.MeshStandardMaterial({ color: 0xa8802f, roughness: 0.6, metalness: 0.35 });
  MAT.iron = new T.MeshStandardMaterial({ color: 0x3c3c44, roughness: 0.5, metalness: 0.8 });
  MAT.brass = new T.MeshStandardMaterial({ color: 0xb98d33, roughness: 0.34, metalness: 0.9 });
  MAT.glass = new T.MeshStandardMaterial({
    color: 0x3a2a1a, emissive: 0xffb35a, emissiveIntensity: 1.6, roughness: 0.3, metalness: 0.0
  });
  MAT.cloth = new T.MeshStandardMaterial({
    map: TEX.sail, color: 0xffffff, roughness: 0.88, metalness: 0.0,
    side: T.DoubleSide, shadowSide: T.DoubleSide
  });
  // subsurface / backlight glow for canvas
  MAT.cloth.onBeforeCompile = (sh) => {
    sh.uniforms.uSunDirW = { value: CFG.sunDir.clone() };
    sh.uniforms.uSss = { value: new T.Color('#ffbe86') };
    sh.uniforms.uTime = { value: 0 };
    sh.uniforms.uFlutter = { value: 1.0 };
    sh.vertexShader = 'varying vec3 vWPos;\nvarying vec3 vWNor;\nuniform float uTime;\nuniform float uFlutter;\n' +
      sh.vertexShader
        .replace('#include <begin_vertex>', `
          #include <begin_vertex>
          float fl = sin(uv.x * 8.0 + uTime * 2.4 + position.y * 0.22 + position.z * 0.11) * 0.55
                   + sin(uv.y * 5.5 - uTime * 3.05 + position.x * 0.3) * 0.45;
          float edge = smoothstep(0.0, 0.30, uv.y) * smoothstep(1.0, 0.72, uv.y);
          transformed.z += fl * edge * uFlutter;
        `)
        .replace('#include <worldpos_vertex>', `
          #include <worldpos_vertex>
          vWPos = (modelMatrix * vec4(transformed, 1.0)).xyz;

        `);
    sh.fragmentShader = 'varying vec3 vWPos;\nvarying vec3 vWNor;\nuniform vec3 uSunDirW;\nuniform vec3 uSss;\n' +
      sh.fragmentShader.replace('#include <lights_fragment_end>', `
        #include <lights_fragment_end>
        {
          vec3 Vd = normalize(cameraPosition - vWPos);
          float back = pow(max(dot(Vd, -uSunDirW), 0.0), 2.2);
          float through = max(dot(-vWNor, uSunDirW), 0.0);

    MAT.cloth.userData.shader = sh;

  MAT.rope = new T.MeshStandardMaterial({ color: 0x4a3826, roughness: 0.95, metalness: 0.0 });
  MAT.ropeLine = new T.LineBasicMaterial({ color: 0x2b2015, transparent: true, opacity: 0.92 });
}

/* ---------------------------------------------------------------- */
/* Smooth sampling of key tables                                     */
/* ---------------------------------------------------------------- */
function keySpline(keys, t) {
  t = clamp(t, keys[0][0], keys[keys.length - 1][0]);
  for (let i = 0; i < keys.length - 1; i++) {
    const a = keys[i], b = keys[i + 1];
    if (t >= a[0] && t <= b[0]) {
      const u = (t - a[0]) / (b[0] - a[0] || 1);
      const w = u * u * (3 - 2 * u);
      return a[1] + (b[1] - a[1]) * w;
    }
  }
  return keys[keys.length - 1][1];
}

/* ---------------------------------------------------------------- */
/* Hull definition                                                   */
/* ---------------------------------------------------------------- */
const HULL = {
  zf: -23, zs: 23, len: 46,
  beam: 6.65,
  keelY: -3.45, deckY: 1.9, railY: 3.15,
  hw: [[0, 0.54], [0.10, 0.82], [0.25, 0.95], [0.45, 1.00], [0.60, 0.975],
       [0.75, 0.865], [0.88, 0.66], [0.96, 0.34], [1, 0.035]],
  sheer: [[0, 0.60], [0.14, 0.20], [0.36, 0.00], [0.62, 0.06], [0.82, 0.34], [0.94, 0.70], [1, 0.95]],
  sheetRise: 1.35,
  // section profile: [v, xFactor, yFactor]
  prof: [[0, 0.0, 0.0], [0.15, 0.24, 0.09], [0.32, 0.47, 0.22], [0.50, 0.68, 0.40],
         [0.68, 0.85, 0.60], [0.84, 0.96, 0.80], [1, 1.0, 1.0]]
};

function hwAt(s) { return HULL.beam * keySpline(HULL.hw, s); }
function sheerAt(s) { return keySpline(HULL.sheer, s) * HULL.sheetRise; }
function keelAt(s) {
  return HULL.keelY
    + 1.9 * Math.pow(smoothstep(0.60, 1.0, s), 1.4)
    + 1.35 * Math.pow(smoothstep(0.42, 0.0, s), 1.4);
}
function deckEdgeAt(s) { return HULL.deckY + sheerAt(s); }
function sectionX(v) { return keySpline(HULL.prof.map(k => [k[0], k[1]]), v); }
function sectionY(v) { return keySpline(HULL.prof.map(k => [k[0], k[2]]), v); }

/* point on the hull skin.  s: 0=stern 1=bow, u: 0=port rail 0.5=keel 1=stbd rail */
function hullPoint(s, u, out) {
  const v = u < 0.5 ? (0.5 - u) * 2 : (u - 0.5) * 2;
  const side = u < 0.5 ? -1 : 1;
  const x = side * hwAt(s) * sectionX(v);
  const y0 = keelAt(s), y1 = deckEdgeAt(s);
  const y = y0 + (y1 - y0) * sectionY(v);
  const z = HULL.zs - s * HULL.len;
  return (out || new T.Vector3()).set(x, y, z);
}

/* offset copy of hullPoint pushed along the surface normal */
const _hp = [];
function hullPointOffset(s, u, dist, out) {
  const e = 0.004;
  const p = hullPoint(s, u, new T.Vector3());
  const a = hullPoint(clamp(s + e, 0, 1), u, new T.Vector3());
  const b = hullPoint(s, clamp(u + e, 0, 1), new T.Vector3());
  const du = a.sub(p).normalize();
  const dv = b.sub(p).normalize();
  const n = dv.cross(du).normalize();
  if (n.y < 0 && Math.abs(n.y) > 0.999) n.set(0, 1, 0);
  // outward = away from the centreline
  const outward = new T.Vector3(p.x, 0, 0).normalize();
  if (n.dot(outward) < 0) n.negate();
  return (out || new T.Vector3()).copy(p).addScaledVector(n, dist);
}

/* ---------------------------------------------------------------- */
/* Grid geometry helper                                              */
/* ---------------------------------------------------------------- */
function gridGeometry(nu, nv, fn, uvFn) {
  const pos = new Float32Array((nu + 1) * (nv + 1) * 3);
  const nor = new Float32Array((nu + 1) * (nv + 1) * 3);
  const uv = new Float32Array((nu + 1) * (nv + 1) * 2);
  const idx = new Uint32Array(nu * nv * 6);
  const tmp = new T.Vector3();
  let p = 0, q = 0, w = 0;
  for (let j = 0; j <= nv; j++) {
    for (let i = 0; i <= nu; i++) {
      const uu = i / nu, vv = j / nv;
      fn(uu, vv, tmp);
      pos[p++] = tmp.x; pos[p++] = tmp.y; pos[p++] = tmp.z;
      nor[w++] = 0; nor[w++] = 0; nor[w++] = 0;
      if (uvFn) { const t = uvFn(uu, vv); uv[q++] = t[0]; uv[q++] = t[1]; }
      else { uv[q++] = uu; uv[q++] = vv; }
    }
  }
  let k = 0;
  for (let j = 0; j < nv; j++) {
    for (let i = 0; i < nu; i++) {
      const a = j * (nu + 1) + i, b = a + 1, c = a + nu + 1, d = c + 1;
      idx[k++] = a; idx[k++] = c; idx[k++] = b;
      idx[k++] = b; idx[k++] = c; idx[k++] = d;
    }
  }
  const g = new T.BufferGeometry();
  g.setAttribute('position', new T.BufferAttribute(pos, 3));
  g.setAttribute('normal', new T.BufferAttribute(nor, 3));
  g.setAttribute('uv', new T.BufferAttribute(uv, 2));
  g.setIndex(new T.BufferAttribute(idx, 1));
  g.computeVertexNormals();
  return g;
}

/* ---------------------------------------------------------------- */
/* Static-geometry batcher: merges everything into one mesh per mat  */
/* ---------------------------------------------------------------- */
function m4(p, e, s) {
  const q = new T.Quaternion();
  q.setFromEuler(new T.Euler(e ? e[0] : 0, e ? e[1] : 0, e ? e[2] : 0, 'YXZ'));
  return new T.Matrix4().compose(
    new T.Vector3(p ? p[0] : 0, p ? p[1] : 0, p ? p[2] : 0), q,
    new T.Vector3(s ? s[0] : 1, s ? s[1] : 1, s ? s[2] : 1));
}

class Batcher {
  constructor() { this.map = new Map(); }
  add(mat, geo, p, e, s) {
    let arr = this.map.get(mat);
    if (!arr) { arr = []; this.map.set(mat, arr); }
    const g = geo.clone();
    if (p || e || s) g.applyMatrix4(m4(p, e, s));
    arr.push(g);
    return this;
  }
  build(group, opts) {
    opts = opts || {};
    for (const [mat, arr] of this.map) {
      const merged = arr.length === 1 ? arr[0] : T.mergeGeometries(arr, false);
      if (!merged) { console.warn('merge failed'); continue; }
      const mesh = new T.Mesh(merged, mat);
      mesh.castShadow = opts.cast !== false;
      mesh.receiveShadow = opts.receive !== false;
      group.add(mesh);
      if (!opts.keep) for (const g of arr) g.dispose();
    }
    this.map.clear();
  }
}

/* ---------------------------------------------------------------- */
/* Hull shell, wales, bulwarks, decks, transom                       */
/* ---------------------------------------------------------------- */
function buildHull(group) {
  const NS = 68, NU = 44;

  // --- skin ------------------------------------------------------
  const skin = gridGeometry(NU, NS, (u, v, out) => {
    hullPoint(v, u, out);   // v = station (0 stern .. 1 bow)
  }, (u, v) => [u * 6, v * 9]);
  // gridGeometry walks fn(uu,vv) -> we passed (v,u) so normals follow
  const hullMesh = new T.Mesh(skin, MAT.hull);
  hullMesh.castShadow = true; hullMesh.receiveShadow = true;
  group.add(hullMesh);

  const B = new Batcher();

  // --- wales / paint bands (offset shells) -----------------------
  const bandGeo = (v0, v1, off, nu) => gridGeometry(nu, 1, (u, v, out) => {
    const vv = v0 + (v1 - v0) * v;
    hullPointOffset(u, vv, off, out);
  }, (u, v) => [u * 8, v]);
  B.add(MAT.paint, bandGeo(0.795, 0.905, 0.055, 80), null, null, null);  // gun stripe
  B.add(MAT.trim,  bandGeo(0.945, 1.0, 0.05, 80), null, null, null);     // sheer rail
  B.add(MAT.paint, bandGeo(0.16, 0.285, 0.05, 60), null, null, null);    // boot stripe

  // --- bulwark: outer + inner face and cap rail ------------------
  const bwOuter = gridGeometry(80, 3, (u, v, out) => {
    const s = u;
    const p = hullPointOffset(s, 1.0, 0.09, out);
    p.y = lerp(deckEdgeAt(s) - 0.35, HULL.railY + sheerAt(s) * 0.55, v);
    p.x *= 1.0 - 0.02 * v;
  }, (u, v) => [u * 12, v * 0.6]);
  B.add(MAT.trim, bwOuter);
  const bwInner = gridGeometry(80, 3, (u, v, out) => {
    const s = u;
    const p = hullPointOffset(s, 1.0, -0.20, out);
    p.y = lerp(deckEdgeAt(s) - 0.35, HULL.railY + sheerAt(s) * 0.55 - 0.12, v);
  }, (u, v) => [u * 12, v * 0.6]);
  B.add(MAT.trim, bwInner);
  // cap rail (top surface + slight inboard overhang)
  const capRail = gridGeometry(80, 1, (u, v, out) => {
    const s = u;
    const o = lerp(0.16, -0.30, v);
    const p = hullPointOffset(s, 1.0, o, out);
    p.y = HULL.railY + sheerAt(s) * 0.55 - 0.02 * v;
  }, (u, v) => [u * 12, v]);
  B.add(MAT.deck, capRail);
  // rail stanchions
  for (let i = 0; i <= 22; i++) {
    const s = i / 22;
    if (s < 0.06 || s > 0.97) continue;
    for (const side of [-1, 1]) {
      const a = hullPointOffset(s, side < 0 ? 0.03 : 0.97, 0.06, new T.Vector3());
      const b = hullPointOffset(s, side < 0 ? 0.03 : 0.97, -0.26, new T.Vector3());
      const h = 1.25;
      B.add(MAT.trim, new T.BoxGeometry(0.16, h, 0.16),
        [(a.x + b.x) / 2, a.y + h * 0.25, a.z], [0, 0, 0], null);
    }
  }

  // --- bulwark planking shrink: inner wall panels ---------------
  // --- main deck (cambered) --------------------------------------
  const deck = gridGeometry(84, 16, (u, v, out) => {
    const s = u;
    const w = (v * 2 - 1);
    const hw = hwAt(s);
    const x = hw * w * 0.995;
    const base = deckEdgeAt(s) - 0.42;
    const camber = 0.34 * (1 - w * w);
    const step = -0.55 * smoothstep(0.62, 0.30, s);   // slight step down aft
    out.set(x, base + camber + step, HULL.zs - s * HULL.len);
  }, (u, v) => [u * 14, v * 4]);
  const deckMesh = new T.Mesh(deck, MAT.deck);
  deckMesh.castShadow = true; deckMesh.receiveShadow = true;
  group.add(deckMesh);

  // --- transom ----------------------------------------------------
  const trans = gridGeometry(14, 12, (u, v, out) => {
    const vv = 0.06 + v * 0.94;
    const xr = sectionX(vv) * hwAt(0);
    const x = (u * 2 - 1) * xr;
    const y0 = keelAt(0), y1 = deckEdgeAt(0);
    const y = y0 + (y1 - y0) * sectionY(vv);
    const z = HULL.zs + 0.35 * (1 - Math.abs(u * 2 - 1) ** 2) + 0.25;
    out.set(x, y, z);
  }, (u, v) => [u * 3, v * 3]);
  const tm = new T.Mesh(trans, MAT.trim);
  tm.castShadow = true; tm.receiveShadow = true;
  group.add(tm);
  // transom decorative mouldings
  for (let i = 0; i < 3; i++) {
    B.add(MAT.paintGold, new T.BoxGeometry(9.4 - i * 1.1, 0.16, 0.2),
      [0, deckEdgeAt(0) - 0.6 - i * 1.15, HULL.zs + 0.55]);
  }
  // stern gallery windows
  for (let i = -3; i <= 3; i++) {
    B.add(MAT.glass, new T.BoxGeometry(0.95, 1.15, 0.14), [i * 1.28, deckEdgeAt(0) + 1.05, HULL.zs + 0.5]);
    B.add(MAT.trim, new T.BoxGeometry(1.12, 0.12, 0.2), [i * 1.28, deckEdgeAt(0) + 1.68, HULL.zs + 0.52]);
    B.add(MAT.trim, new T.BoxGeometry(0.12, 1.3, 0.2), [i * 1.28 - 0.7, deckEdgeAt(0) + 1.05, HULL.zs + 0.52]);
  }
  // rudder
  B.add(MAT.trim, new T.BoxGeometry(0.32, 3.6, 1.5), [0, -2.4, HULL.zs + 0.75], [0.12, 0, 0]);
  // keel + stem
  const keelPts = [];
  for (let i = 0; i <= 24; i++) {
    const s = i / 24;
    keelPts.push(new T.Vector2(hwAt(s) * 0.16 + 0.12, -keelAt(s) * -1));
  }
  // stem post at the bow
  for (let i = 0; i <= 10; i++) {
    const t = i / 10;
    B.add(MAT.trim, new T.BoxGeometry(0.42, 0.42, 1.4),
      [0, lerp(keelAt(0.99), deckEdgeAt(1) + 0.2, t) + 0.2, lerp(HULL.zf + 0.5, HULL.zf - 0.6, t)],
      [-0.25 * (1 - t), 0, 0]);
  }
  // bowsprit is built with the rigging

  B.build(group);
}

/* ---------------------------------------------------------------- */
/* Deck houses, castles, furniture                                   */
/* ---------------------------------------------------------------- */
function buildCastles(group) {
  const B = new Batcher();
  const zf = HULL.zf, zs = HULL.zs;

  function boxAt(mat, w, h, d, p, e) { B.add(mat, new T.BoxGeometry(w, h, d), p, e); }

  /* ---- forecastle deck ---- */
  const fcY = 3.45, fcZ0 = zf + 3, fcZ1 = zf + 12.5;
  const fcDeck = gridGeometry(40, 12, (u, v, out) => {
    const z = lerp(fcZ0, fcZ1, u);
    const s = (zs - z) / HULL.len;
    const w = v * 2 - 1;
    out.set(hwAt(s) * w * 0.97, fcY + 0.16 * (1 - w * w), z);
  }, (u, v) => [u * 6, v * 2]);
  B.add(MAT.deck, fcDeck);
  // forecastle bulwark
  for (const side of [-1, 1]) {
    const g = gridGeometry(30, 2, (u, v, out) => {
      const z = lerp(fcZ0, fcZ1, u);
      const s = (zs - z) / HULL.len;
      out.set(side * hwAt(s) * 0.97, fcY + 1.05 * v, z);
    }, (u, v) => [u * 6, v]);
    B.add(MAT.trim, g);
  }
  // bulkhead
  boxAt(MAT.trim, 10.6, 1.7, 0.4, [0, fcY + 0.55, fcZ1]);
  // breakwater steps
  for (let i = 0; i < 4; i++) boxAt(MAT.trim, 7.4 - i * 0.3, 0.22, 0.82, [0, 0.6 + i * 0.52, fcZ1 + 0.6 + i * 0.75]);

  /* ---- quarterdeck + poop ---- */
  const qY = 4.25, qZ0 = 5.5, qZ1 = zs - 1.2;
  const qDeck = gridGeometry(34, 14, (u, v, out) => {
    const z = lerp(qZ0, qZ1, u);
    const s = (zs - z) / HULL.len;
    const w = v * 2 - 1;
    out.set(hwAt(s) * w * 0.955, qY + 0.15 * (1 - w * w), z);
  }, (u, v) => [u * 6, v * 2]);
  B.add(MAT.deck, qDeck);
  for (const side of [-1, 1]) {
    const g = gridGeometry(30, 2, (u, v, out) => {
      const z = lerp(qZ0, qZ1, u);
      const s = (zs - z) / HULL.len;
      out.set(side * hwAt(s) * 0.955, qY + 1.15 * v, z);
    }, (u, v) => [u * 6, v]);
    B.add(MAT.trim, g);
  }
  boxAt(MAT.trim, 10.2, 1.9, 0.42, [0, qY + 0.6, qZ0]);

  const pY = 6.1, pZ0 = 15.5, pZ1 = zs - 1.6;
  const pDeck = gridGeometry(24, 12, (u, v, out) => {
    const z = lerp(pZ0, pZ1, u);
    const s = (zs - z) / HULL.len;
    const w = v * 2 - 1;
    out.set(hwAt(s) * w * 0.93, pY + 0.14 * (1 - w * w), z);
  }, (u, v) => [u * 4, v * 2]);
  B.add(MAT.deck, pDeck);
  for (const side of [-1, 1]) {
    const g = gridGeometry(22, 2, (u, v, out) => {
      const z = lerp(pZ0, pZ1, u);
      const s = (zs - z) / HULL.len;
      out.set(side * hwAt(s) * 0.93, pY + 1.0 * v, z);
    }, (u, v) => [u * 4, v]);
    B.add(MAT.trim, g);
  }

  /* ---- stern cabin block ---- */
  boxAt(MAT.trim, 9.6, 2.6, 6.4, [0, qY + 1.3, qZ1 - 3.4]);
  boxAt(MAT.paint, 9.9, 0.34, 6.7, [0, qY + 2.5, qZ1 - 3.4]);
  // cabin side windows
  for (let i = 0; i < 4; i++) {
    for (const side of [-1, 1]) {
      B.add(MAT.glass, new T.BoxGeometry(0.14, 0.75, 0.95),
        [side * 4.75, qY + 1.5, qZ1 - 6.4 + i * 1.5]);
    }
  }
  // cabin doors + arch
  boxAt(MAT.trim, 1.5, 1.9, 0.18, [0, qY + 1.0, qZ1 - 6.55]);
  B.add(MAT.paintGold, new T.TorusGeometry(0.8, 0.08, 6, 12, Math.PI), [0, qY + 1.95, qZ1 - 6.5], [0, 0, 0]);

  // belfry / companionway on the quarterdeck
  boxAt(MAT.trim, 1.5, 1.5, 1.5, [2.6, qY + 0.75, qZ0 + 3.2]);
  B.add(MAT.brass, new T.SphereGeometry(0.34, 12, 10), [2.6, qY + 1.75, qZ0 + 3.2]);

  /* ---- ship's wheel ---- */
  const wx = 0, wy = qY + 0.2, wz = qZ0 + 4.6;
  B.add(MAT.trim, new T.BoxGeometry(0.5, 1.5, 0.5), [0, wy + 0.75, wz]);
  B.add(MAT.brass, new T.CylinderGeometry(0.12, 0.12, 1.25, 8), [0, wy + 1.55, wz - 0.35], [Math.PI / 2 - 0.25, 0, 0]);
  const wheel = new T.Group();
  const wheelParts = new Batcher();
  wheelParts.add(MAT.trim, new T.TorusGeometry(0.85, 0.075, 6, 20), [0, 0, 0]);
  wheelParts.add(MAT.trim, new T.CylinderGeometry(0.16, 0.16, 0.3, 10), [0, 0, 0.1], [Math.PI / 2, 0, 0]);
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2;
    wheelParts.add(MAT.trim, new T.CylinderGeometry(0.05, 0.05, 2.35, 6),
      [Math.cos(a) * 0.02, Math.sin(a) * 0.02, 0], [0, 0, a + Math.PI / 2]);
  }
  wheelParts.build(wheel);
  wheel.position.set(wx, wy + 1.75, wz - 0.12);
  wheel.rotation.y = 0.0;
  group.add(wheel);

  /* ---- capstan ---- */
  const cx = 0, cy = deckEdgeAt(0.55) - 0.42 + 0.34, cz = 2.0;
  B.add(MAT.trim, new T.CylinderGeometry(0.62, 0.75, 1.5, 12), [cx, cy + 0.75, cz]);
  B.add(MAT.trim, new T.CylinderGeometry(0.9, 0.85, 0.28, 12), [cx, cy + 1.5, cz]);
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2;
    B.add(MAT.spar, new T.CylinderGeometry(0.075, 0.075, 2.0, 6),
      [cx + Math.cos(a) * 0.9, cy + 1.35, cz + Math.sin(a) * 0.9], [Math.PI / 2 * 0, -a, Math.PI / 2 * 0]);
    B.add(MAT.spar, new T.CylinderGeometry(0.075, 0.075, 2.2, 6),
      [cx + Math.cos(a) * 0.55, cy + 1.35, cz + Math.sin(a) * 0.55], [Math.PI / 2, 0, -a]);
  }

  /* ---- hatches and gratings ---- */
  function grating(x, y, z, w, d) {
    B.add(MAT.trim, new T.BoxGeometry(w, 0.22, d), [x, y + 0.11, z]);
    const n = Math.max(3, Math.round(w / 0.45));
    for (let i = 0; i < n; i++) {
      const gx = x - w / 2 + (i + 0.5) * (w / n);
      B.add(MAT.spar, new T.BoxGeometry(0.14, 0.1, d - 0.12), [gx, y + 0.26, z]);
    }
    const m = Math.max(3, Math.round(d / 0.45));
    for (let i = 0; i < m; i++) {
      const gz = z - d / 2 + (i + 0.5) * (d / m);
      B.add(MAT.spar, new T.BoxGeometry(w - 0.12, 0.09, 0.13), [x, y + 0.3, gz]);
    }
  }
  const deckY0 = deckEdgeAt(0.5) - 0.42 + 0.34;
  grating(0, deckY0, -5.6, 5.0, 3.6);
  grating(0, deckY0, 6.2, 3.4, 2.4);
  // hatch coaming
  for (const [w, d, z] of [[5.6, 4.2, -5.6], [4.0, 3.0, 6.2]]) {
    B.add(MAT.trim, new T.BoxGeometry(w, 0.5, 0.22), [0, deckY0 + 0.25, z - d / 2]);
    B.add(MAT.trim, new T.BoxGeometry(w, 0.5, 0.22), [0, deckY0 + 0.25, z + d / 2]);
    B.add(MAT.trim, new T.BoxGeometry(0.22, 0.5, d), [w / 2, deckY0 + 0.25, z]);
    B.add(MAT.trim, new T.BoxGeometry(0.22, 0.5, d), [-w / 2, deckY0 + 0.25, z]);
  }

  /* ---- companionway ladders ---- */
  function ladder(x, y, z, h, rot) {
    for (let i = 0; i < 6; i++) B.add(MAT.deck, new T.BoxGeometry(1.5, 0.1, 0.3), [x, y + 0.12 + i * (h / 6), z + i * 0.22], [rot, 0, 0]);
    for (const side of [-1, 1]) B.add(MAT.trim, new T.BoxGeometry(0.12, h + 0.3, 0.16), [x + side * 0.78, y + h / 2, z + h * 0.22 * 0.5], [rot, 0, 0]);
  }
  ladder(2.6, qY, qZ0 + 1.4, 1.6, 1.05);
  ladder(-2.6, qY, qZ0 + 1.4, 1.6, 1.05);
  ladder(3.1, HULL.deckY + 0.1, fcZ1 + 3.4, 1.5, -1.05);
  ladder(-3.1, HULL.deckY + 0.1, fcZ1 + 3.4, 1.5, -1.05);

  /* ---- barrels, crates, chests ---- */
  function barrel(x, y, z, s, lie) {
    const pts = [];
    for (let i = 0; i <= 8; i++) {
      const t = i / 8;
      pts.push(new T.Vector2(0.52 * (0.72 + 0.4 * Math.sin(t * Math.PI)) * s, (t - 0.5) * 1.5 * s));
    }
    const g = new T.LatheGeometry(pts, 12);
    if (lie) B.add(MAT.trim, g, [x, y + 0.5 * s, z], [0, 0, Math.PI / 2]);
    else B.add(MAT.trim, g, [x, y + 0.75 * s, z], null);
    B.add(MAT.iron, new T.TorusGeometry(0.56 * s, 0.035 * s, 5, 12), [x, y + 0.2 * s, z], [Math.PI / 2, 0, 0]);
    B.add(MAT.iron, new T.TorusGeometry(0.60 * s, 0.035 * s, 5, 12), [x, y + 0.78 * s, z], [Math.PI / 2, 0, 0]);
    if (!lie) B.add(MAT.iron, new T.TorusGeometry(0.56 * s, 0.035 * s, 5, 12), [x, y + 1.36 * s, z], [Math.PI / 2, 0, 0]);
  }
  function crate(x, y, z, w, h, d, rot) {
    B.add(MAT.trim, new T.BoxGeometry(w, h, d), [x, y + h / 2, z], [0, rot || 0, 0]);
    B.add(MAT.spar, new T.BoxGeometry(w * 1.02, 0.07, 0.07), [x, y + h * 0.82, z], [0, rot || 0, 0]);
    B.add(MAT.spar, new T.BoxGeometry(w * 1.02, 0.07, 0.07), [x, y + h * 0.18, z], [0, rot || 0, 0]);
  }
  barrel(-5.1, deckY0, -3.0, 0.8);
  barrel(-4.6, deckY0, -4.3, 0.8);
  barrel(-5.0, deckY0, -5.5, 0.72);
  barrel(5.0, deckY0, -2.2, 0.8);
  barrel(5.3, deckY0, -3.4, 0.72);
  crate(4.4, deckY0, -0.6, 1.4, 1.1, 1.2, 0.3);
  crate(5.4, deckY0, -1.1, 1.0, 0.8, 0.9, -0.2);
  crate(-4.6, deckY0, 0.9, 1.6, 1.2, 1.3, -0.4);
  barrel(4.4, deckY0, 8.4, 0.85);
  barrel(3.4, deckY0, 9.0, 0.7);
  crate(-3.0, qY, qZ0 + 2.4, 1.5, 1.1, 1.2, 0.5);
  barrel(3.9, qY, qZ0 + 2.0, 0.7);

  /* ---- longboat on the deck ---- */
  const boat = new T.Group();
  boat.position.set(0.2, deckY0 + 0.9, -1.2);
  boat.rotation.y = 0.02;
  const bb = new Batcher();
  const bl = 7.2, bw = 2.2;
  const bg = gridGeometry(18, 8, (u, v, out) => {
    const s = u;
    const w = (v * 2 - 1);
    const hwf = bw * Math.pow(Math.sin(Math.PI * clamp(s * 0.94 + 0.05, 0, 1)), 0.55);
    out.set(w * hwf, -0.85 * Math.pow(w * w, 0.8) * 1.0, (s - 0.5) * bl);
  }, (u, v) => [u * 3, v]);
  bb.add(MAT.trim, bg);
  const bg2 = gridGeometry(18, 6, (u, v, out) => {
    const s = u;
    const w = (v * 2 - 1);
    const hwf = bw * Math.pow(Math.sin(Math.PI * clamp(s * 0.94 + 0.05, 0, 1)), 0.55);
    out.set(w * hwf * 0.9, -0.02, (s - 0.5) * bl);
  }, (u, v) => [u * 3, v]);
  bb.add(MAT.deck, bg2);
  for (const side of [-1, 1]) {
    const g = gridGeometry(18, 2, (u, v, out) => {
      const s = u;
      const hwf = bw * Math.pow(Math.sin(Math.PI * clamp(s * 0.94 + 0.05, 0, 1)), 0.55);
      out.set(side * hwf * (1 - 0.08 * v), 0.42 * v, (s - 0.5) * bl);
    }, (u, v) => [u * 3, v]);
    bb.add(MAT.trim, g);
  }
  for (let i = 0; i < 5; i++) bb.add(MAT.deck, new T.BoxGeometry(1.6, 0.09, 0.3), [0, 0.02 + i * 0.05, -1.8 + i * 0.9]);
  bb.build(boat);
  group.add(boat);

  /* ---- small deck details: belaying pins, buckets, lanterns ---- */
  for (let i = 0; i < 10; i++) {
    const z = -8 + i * 3.6;
    for (const side of [-1, 1]) {
      const s = (zs - z) / HULL.len;
      const p = hullPointOffset(s, side < 0 ? 0.03 : 0.97, -0.42, new T.Vector3());
      B.add(MAT.spar, new T.CylinderGeometry(0.06, 0.06, 0.55, 6), [p.x, p.y + 0.5, p.z]);
    }
  }
  for (let i = 0; i < 4; i++) {
    const s = 0.30 + i * 0.12;
    for (const side of [-1, 1]) {
      const p = hullPointOffset(s, side < 0 ? 0.05 : 0.95, 0.0, new T.Vector3());
      B.add(MAT.iron, new T.TorusGeometry(0.3, 0.045, 5, 10), [p.x + side * 0.15, p.y, p.z], [Math.PI / 2, 0, side * 1.57]);
    }
  }

  /* ---- anchors ---- */
  for (const side of [-1, 1]) {
    const p = hullPointOffset(0.90, side < 0 ? 0.06 : 0.94, 0.5, new T.Vector3());
    B.add(MAT.iron, new T.CylinderGeometry(0.09, 0.09, 3.4, 6), [p.x, p.y - 1.9, p.z], [0, 0, 0]);
    B.add(MAT.iron, new T.BoxGeometry(0.12, 0.12, 2.6), [p.x, p.y - 3.4, p.z], [0.2, 0, 0]);
    B.add(MAT.iron, new T.TorusGeometry(0.45, 0.09, 6, 12), [p.x, p.y - 0.35, p.z + 0.1], [0, 0, 0]);
    for (const s2 of [-1, 1]) {
      B.add(MAT.iron, new T.ConeGeometry(0.3, 1.1, 5), [p.x, p.y - 3.9, p.z + s2 * 0.85], [s2 * 0.9, 0, 0]);
    }
  }

  /* ---- figurehead ---- */
  const fz = HULL.zf - 1.1, fy = deckEdgeAt(1) + 0.45;
  B.add(MAT.paintGold, new T.SphereGeometry(0.62, 14, 12), [0, fy, fz], null, [1, 1.25, 1]);
  B.add(MAT.paintGold, new T.CylinderGeometry(0.3, 0.42, 1.2, 10), [0, fy - 0.9, fz + 0.15], [0.35, 0, 0]);
  B.add(MAT.paintGold, new T.TorusGeometry(0.42, 0.1, 6, 14), [0, fy + 0.5, fz - 0.1], [0.4, 0, 0]);
  B.build(group);
}

Batcher.prototype.addM = function (mat, geo, mtx) {
  let arr = this.map.get(mat);
  if (!arr) { arr = []; this.map.set(mat, arr); }
  const g = geo.clone();
  if (mtx) g.applyMatrix4(mtx);
  arr.push(g);
  return this;
};

/* ---------------------------------------------------------------- */
/* Sail geometry                                                     */
/* ---------------------------------------------------------------- */
/* square sail: head at y=0 spanning x, hangs to y=-H, bellies to -z */
function sailGeo(W, H, bulge, cu, cv, opt) {
  opt = opt || {};
  const footTaper = opt.footTaper != null ? opt.footTaper : 0.88;
  const round = opt.round != null ? opt.round : 0.14;
  return gridGeometry(cu, cv, (u, v, out) => {
    const taper = 1 - (1 - footTaper) * smoothstep(0.30, 1.0, v);
    const x = (u - 0.5) * W * taper;
    const footLift = round * H * Math.sin(Math.PI * u) * smoothstep(0.35, 1.0, v);
    const y = -v * H + footLift;
    const bell = Math.sin(Math.PI * u) * Math.pow(Math.sin(Math.PI * clamp(v * 1.03, 0, 1)), 0.5);
    const wrinkle = 0.055 * Math.sin(u * Math.PI * 5.0) * Math.sin(v * Math.PI * 2.2);
    const z = -bulge * bell * (0.5 + 0.5 * v) + bulge * wrinkle;
    out.set(x, y, z);
  }, (u, v) => [u * 2.2, v * 2.2]);
}

/* triangular staysail between head, tack and clew (all local) */
function sailTriGeo(head, tack, clew, bulge, cu, cv) {
  const A = new T.Vector3(), B = new T.Vector3(), n = new T.Vector3();
  const e1 = new T.Vector3().subVectors(tack, head);
  const e2 = new T.Vector3().subVectors(clew, head);
  n.crossVectors(e2, e1).normalize();
  return gridGeometry(cu, cv, (u, v, out) => {
    A.copy(head).addScaledVector(tack, v);
    B.copy(head).addScaledVector(clew, v);
    out.lerpVectors(A, B, u);
    const bell = Math.sin(Math.PI * clamp(u * 0.96 + 0.02, 0, 1)) * Math.pow(Math.sin(Math.PI * clamp(v * 0.94 + 0.03, 0, 1)), 0.5);
    out.addScaledVector(n, -bulge * bell);
  }, (u, v) => [u * 2, v * 2]);
}

const MASTS = [
  { id: 'fore',   z: -12.6, deckY: 3.45, lowerH: 12.4, lowerR: 0.54, topH: 8.6, topR: 0.34, tgH: 6.4, tgR: 0.20, rake: 0.030 },
  { id: 'main',   z:   1.2, deckY: 1.94, lowerH: 15.0, lowerR: 0.62, topH: 10.0, topR: 0.38, tgH: 7.8, tgR: 0.23, rake: 0.028 },
  { id: 'mizzen', z:  14.2, deckY: 4.27, lowerH: 10.4, lowerR: 0.46, topH: 7.4, topR: 0.29, tgH: 5.4, tgR: 0.17, rake: 0.022 }
];
const BRACE = 0.085;    // yards braced a touch to starboard

/* bowsprit: a raked spar projecting forward over the stem */
const BSP_ROOT = new T.Vector3(0, 4.30, HULL.zf - 1.6);
const BSP_DIR = new T.Vector3(0, Math.sin(0.28), -Math.cos(0.28)).normalize();
const BSP_TIP = BSP_ROOT.clone().addScaledVector(BSP_DIR, 18);

function mastPoints(m) {
  const lowerBase = new T.Vector3(0, m.deckY - 0.3, m.z);
  const lowerTop = new T.Vector3(0, m.deckY + m.lowerH, m.z + m.lowerH * m.rake);
  const topTop = new T.Vector3(0, lowerTop.y + m.topH, lowerTop.z + m.topH * m.rake);
  const tgTop = new T.Vector3(0, topTop.y + m.tgH, topTop.z + m.tgH * m.rake);
  return { lowerBase, lowerTop, topTop, tgTop };
}

/* a tapered spar from a to b */
function sparBatcher(B, mat, a, b, r0, r1, seg) {
  const dir = new T.Vector3().subVectors(b, a);
  const len = dir.length();
  const q = new T.Quaternion().setFromUnitVectors(new T.Vector3(0, 1, 0), dir.clone().normalize());
  const mtx = new T.Matrix4().compose(new T.Vector3().addVectors(a, b).multiplyScalar(0.5), q, new T.Vector3(1, 1, 1));
  B.addM(mat, new T.CylinderGeometry(r1, r0, len, seg || 10), mtx);
  return { len, dir };
}

function buildRig(group, trailObjs) {
  const B = new Batcher();
  const RB = new Batcher();          // ropes (cylinders)
  const lines = [];                  // thin line segments
  const addLine = (a, b) => { lines.push(a.x, a.y, a.z, b.x, b.y, b.z); };
  const addRope = (a, b, r) => {
    const dir = new T.Vector3().subVectors(b, a);
    const len = dir.length();
    const q = new T.Quaternion().setFromUnitVectors(new T.Vector3(0, 1, 0), dir.clone().normalize());
    const mtx = new T.Matrix4().compose(new T.Vector3().addVectors(a, b).multiplyScalar(0.5), q, new T.Vector3(1, 1, 1));
    RB.addM(MAT.rope, new T.CylinderGeometry(r, r, len, 5, 1), mtx);
  };

  /* ---------------- masts + yards ---------------- */
  const mastInfo = {};
  for (const m of MASTS) {
    const P = mastPoints(m);
    mastInfo[m.id] = P;
    P.yards = [];

    sparBatcher(B, MAT.spar, P.lowerBase, P.lowerTop, m.lowerR, m.lowerR * 0.60, 12);
    // mast coat / partners
    B.add(MAT.trim, new T.CylinderGeometry(m.lowerR * 1.5, m.lowerR * 1.7, 0.55, 12), [0, m.deckY + 0.1, m.z]);
    // fighting top
    const topR = m.lowerR * 2.5 + 0.9;
    B.add(MAT.deck, new T.CylinderGeometry(topR, topR * 0.72, 0.26, 14), [0, P.lowerTop.y - 0.55, P.lowerTop.z]);
    B.add(MAT.trim, new T.CylinderGeometry(topR * 1.02, topR * 1.02, 0.22, 14, 1, true), [0, P.lowerTop.y - 0.36, P.lowerTop.z]);
    // crosstrees + trestletrees
    for (const side of [-1, 1]) {
      B.add(MAT.trim, new T.BoxGeometry(topR * 0.9, 0.18, 0.42), [side * topR * 0.55, P.lowerTop.y - 0.44, P.lowerTop.z]);
    }
    B.add(MAT.trim, new T.BoxGeometry(0.5, 0.2, 1.7), [0, P.lowerTop.y - 0.44, P.lowerTop.z]);
    // topmast + cap
    sparBatcher(B, MAT.spar, new T.Vector3(0, P.lowerTop.y - 0.9, P.lowerTop.z),
      P.topTop, m.topR, m.topR * 0.62, 10);
    B.add(MAT.trim, new T.BoxGeometry(1.0, 0.36, 1.5), [0, P.lowerTop.y + 0.05, P.lowerTop.z + 0.05]);
    // topgallant mast
    sparBatcher(B, MAT.spar, new T.Vector3(0, P.topTop.y - 0.7, P.topTop.z), P.tgTop, m.tgR, m.tgR * 0.55, 8);
    B.add(MAT.trim, new T.BoxGeometry(0.7, 0.26, 1.0), [0, P.topTop.y + 0.0, P.topTop.z]);
    // truck
    B.add(MAT.brass, new T.SphereGeometry(m.tgR * 1.5, 8, 6), [0, P.tgTop.y + 0.25, P.tgTop.z]);

    /* yards */
    const yardDefs = [];
    if (m.id !== 'mizzen') {
      yardDefs.push({ h: m.deckY + m.lowerH - 2.9, len: m.id === 'main' ? 15.6 : 13.6, r: m.lowerR * 0.42, kind: 'course' });
      yardDefs.push({ h: m.deckY + m.lowerH + 3.5, len: m.id === 'main' ? 12.2 : 10.4, r: m.topR * 0.45, kind: 'topsail' });
      yardDefs.push({ h: m.deckY + m.lowerH + m.topH - 1.5, len: m.id === 'main' ? 8.8 : 7.4, r: m.tgR * 0.5, kind: 'tg' });
    } else {
      yardDefs.push({ h: m.deckY + m.lowerH - 2.5, len: 10.6, r: 0.20, kind: 'course' });
      yardDefs.push({ h: m.deckY + m.lowerH + 3.1, len: 8.2, r: 0.15, kind: 'topsail' });
    }
    for (const yd of yardDefs) {
      const yz = m.z + (yd.h - m.deckY) * m.rake;
      const bq = new T.Quaternion().setFromEuler(new T.Euler(0, BRACE, 0));
      const off = new T.Vector3(0, yd.h, yz);
      const a = new T.Vector3(-yd.len / 2, 0, 0).applyQuaternion(bq).add(off);
      const b = new T.Vector3(yd.len / 2, 0, 0).applyQuaternion(bq).add(off);
      sparBatcher(B, MAT.spar, a, b, yd.r, yd.r * 0.62, 9);
      // yardarm tips / stunsail irons
      for (const t of [a, b]) {
        B.add(MAT.spar, new T.CylinderGeometry(yd.r * 0.55, yd.r * 0.3, 0.5, 6), [t.x, t.y + 0.15, t.z]);
      }
      // parrel / truss at the mast
      B.add(MAT.rope, new T.TorusGeometry(yd.r * 2.2, 0.07, 5, 10), [0, yd.h, m.z + (yd.h - m.deckY) * m.rake], [Math.PI / 2, 0, 0]);
      mastInfo[m.id].yards.push({ a, b, y: yd.h, z: m.z + (yd.h - m.deckY) * m.rake, kind: yd.kind, len: yd.len });
    }

    /* masthead lantern on the main + fore */
    if (m.id !== 'mizzen') {
      const ly = m.deckY + m.lowerH + m.topH - 2.6;
      const lz = m.z + (ly - m.deckY) * m.rake;
      B.add(MAT.brass, new T.BoxGeometry(0.5, 0.66, 0.5), [0, ly, lz]);
      B.add(MAT.glass, new T.BoxGeometry(0.36, 0.5, 0.36), [0, ly, lz]);
      trailObjs.lanterns.push(new T.Vector3(0, ly, lz));
      if (m.id === 'main') trailObjs.lights.push({ pos: new T.Vector3(0, ly, lz), color: 0xffb45a, intensity: 6.5, dist: 22 });
    }

    /* shrouds + ratlines */
    const chainS = (HULL.zs - m.z) / HULL.len;
    const chY = deckEdgeAt(chainS) + 0.35;
    const shroudTopY = m.deckY + m.lowerH - 1.1;
    const shroudTopZ = m.z + (shroudTopY - m.deckY) * m.rake;
    const nSh = m.id === 'mizzen' ? 3 : 4;
    for (const side of [-1, 1]) {
      // channel platform
      const hw = hwAt(chainS);
      B.add(MAT.trim, new T.BoxGeometry(0.95, 0.22, 4.4), [side * (hw + 0.42), chY + 0.1, m.z + 0.2]);
      const anchors = [];
      for (let i = 0; i < nSh; i++) {
        const zoff = -1.5 + i * (3.0 / Math.max(1, nSh - 1));
        const ax = side * (hw + 0.72);
        const az = m.z + 0.2 + zoff;
        anchors.push(new T.Vector3(ax, chY + 0.35, az));
        // deadeye
        B.add(MAT.iron, new T.CylinderGeometry(0.17, 0.17, 0.16, 8), [ax, chY + 0.42, az]);
        addRope(new T.Vector3(ax, chY + 0.5, az), new T.Vector3(0, shroudTopY, shroudTopZ), 0.05);
      }
      // ratlines
      for (let i = 0; i < 9; i++) {
        const t = 0.14 + i * 0.095;
        const a = new T.Vector3(side * (hw + 0.72), lerp(chY + 0.5, shroudTopY, t), lerp(m.z + 0.2 - 1.5, shroudTopZ, t));
        const b = new T.Vector3(side * (hw + 0.72), lerp(chY + 0.5, shroudTopY, t), lerp(m.z + 0.2 + 1.5, shroudTopZ, t));
        addLine(a, b);
      }
      // topmast shrouds (futtocks) up to the top
      for (let i = 0; i < 2; i++) {
        const zoff = -0.5 + i * 1.0;
        addRope(new T.Vector3(side * (topR * 0.85), P.lowerTop.y - 0.6, P.lowerTop.z + zoff * 0.4),
          new T.Vector3(0, P.topTop.y - 1.2, P.topTop.z), 0.035);
      }
      // backstays
      const bsY = m.deckY + m.lowerH + m.topH - 2.0;
      const bsZ = m.z + (bsY - m.deckY) * m.rake;
      const aftS = clamp((HULL.zs - (m.z + 6)) / HULL.len, 0, 1);
      addRope(new T.Vector3(0, bsY, bsZ), new T.Vector3(side * (hwAt(aftS) + 0.4), deckEdgeAt(aftS) + 1.2, m.z + 6.5), 0.04);
      addRope(new T.Vector3(0, shroudTopY + 1.0, shroudTopZ + 1.0), new T.Vector3(side * (hwAt(aftS) + 0.5), deckEdgeAt(aftS) + 0.9, m.z + 5.0), 0.035);
    }
  }

  /* ---------------- stays ---------------- */
  const F = mastInfo.fore, M = mastInfo.main, Mi = mastInfo.mizzen;
  const stemTop = new T.Vector3(0, deckEdgeAt(1) + 0.55, HULL.zf - 0.3);
  const bspRoot = BSP_ROOT, bspTip = BSP_TIP;

  // bowsprit structure
  sparBatcher(B, MAT.spar, bspRoot, bspTip, 0.34, 0.16, 10);
  B.add(MAT.trim, new T.BoxGeometry(1.3, 0.5, 1.1), [0, deckEdgeAt(1) + 0.75, HULL.zf - 2.4]);
  B.add(MAT.trim, new T.BoxGeometry(1.1, 0.42, 0.9), [0, bspRoot.y + 0.5, bspRoot.z - 4.5]);
  addRope(bspTip, stemTop, 0.05);                                        // bobstay
  addRope(bspTip.clone().add(new T.Vector3(0, 0.1, 0)), new T.Vector3(0.9, deckEdgeAt(1) + 0.9, HULL.zf - 2.0), 0.045);
  addRope(bspTip.clone().add(new T.Vector3(0, 0.1, 0)), new T.Vector3(-0.9, deckEdgeAt(1) + 0.9, HULL.zf - 2.0), 0.045);

  const fLowerTop = F.lowerTop, mTopTop = M.topTop, fTopTop = F.topTop;
  addRope(new T.Vector3(0, fLowerTop.y + 1.0, fLowerTop.z), stemTop, 0.06);           // fore stay
  addRope(new T.Vector3(0, mTopTop.y + 0.8, mTopTop.z), new T.Vector3(0, fLowerTop.y + 0.4, fLowerTop.z), 0.07);  // main stay
  addRope(new T.Vector3(0, fTopTop.y + 0.5, fTopTop.z), bspTip, 0.05);               // fore topmast stay -> jib
  addRope(new T.Vector3(0, Mi.topTop.y + 0.5, Mi.topTop.z), new T.Vector3(0, mTopTop.y - 1.0, mTopTop.z), 0.05); // mizzen stay
  addRope(new T.Vector3(0, fTopTop.y + 0.4, fTopTop.z), bspRoot.clone().add(new T.Vector3(0, 0.4, 0)), 0.045);
  addRope(new T.Vector3(0, M.tgTop.y - 1.0, M.tgTop.z), new T.Vector3(0, fTopTop.y - 0.5, fTopTop.z), 0.04);      // main topmast stay

  // martingales / bowsprit netting
  for (let i = 0; i < 4; i++) {
    const t = i / 3;
    const a = new T.Vector3(0, lerp(bspTip.y, stemTop.y, t) + 0.05, lerp(bspTip.z, stemTop.z, t));
    addLine(a, new T.Vector3(-2.2 + i * 1.45, deckEdgeAt(1) + 0.2, lerp(HULL.zf - 4.0, HULL.zf - 1.5, t)));
  }

  /* ---------------- braces / lifts / sheets ---------------- */
  const order = ['fore', 'main', 'mizzen'];
  for (let mi = 0; mi < order.length; mi++) {
    const m = MASTS[mi], P = mastInfo[m.id];
    for (const yd of P.yards) {
      // lifts from the yard tips up to the masthead
      const headY = yd.kind === 'course' ? m.deckY + m.lowerH - 1.2
                  : yd.kind === 'topsail' ? P.lowerTop.y + 0.6 : P.topTop.y + 0.4;
      const headZ = m.z + (headY - m.deckY) * m.rake;
      addLine(yd.a, new T.Vector3(0, headY, headZ));
      addLine(yd.b, new T.Vector3(0, headY, headZ));
      // braces to the deck aft
      const bs = clamp((HULL.zs - (m.z + 8)) / HULL.len, 0, 1);
      addLine(yd.b, new T.Vector3(clamp(hwAt(bs) * 0.9, 1, 6), m.deckY + 0.4, m.z + 8.5));
      addLine(yd.a, new T.Vector3(-clamp(hwAt(bs) * 0.9, 1, 6), m.deckY + 0.4, m.z + 9.5));
    }
  }

  // line geometry (thin cordage)
  const lg = new T.BufferGeometry();
  lg.setAttribute('position', new T.BufferAttribute(new Float32Array(lines), 3));
  const lmesh = new T.LineSegments(lg, MAT.ropeLine);
  lmesh.frustumCulled = false;
  group.add(lmesh);

  RB.build(group, { keep: true });
  B.build(group, { keep: true });
  return mastInfo;
}

/* ---------------------------------------------------------------- */
/* Sails                                                             */
/* ---------------------------------------------------------------- */
function buildSails(group, mastInfo) {
  const S = new Batcher();
  const F = MASTS[0], M = MASTS[1], Mi = MASTS[2];
  const q = new T.Quaternion().setFromEuler(new T.Euler(0, BRACE, 0));

  function squareSail(m, y, z, W, H, bulge, extraY) {
    const g = sailGeo(W, H, bulge, 26, 18);
    const p = new T.Vector3(0, y, z);
    const mtx = new T.Matrix4().compose(p, q, new T.Vector3(1, 1, 1));
    S.addM(MAT.cloth, g, mtx);
  }

  const zAt = (m, y) => m.z + (y - m.deckY) * m.rake;

  // fore
  let y = F.deckY + F.lowerH - 2.9;  squareSail(F, y - 0.05, zAt(F, y), 13.0, 7.0, 1.5);
  y = F.deckY + F.lowerH + 3.5;      squareSail(F, y - 0.05, zAt(F, y), 10.2, 6.3, 1.25);
  y = F.deckY + F.lowerH + F.topH - 1.5; squareSail(F, y - 0.05, zAt(F, y), 7.2, 4.4, 0.95);
  // main
  y = M.deckY + M.lowerH - 2.9;      squareSail(M, y - 0.05, zAt(M, y), 15.0, 7.6, 1.7);
  y = M.deckY + M.lowerH + 3.5;      squareSail(M, y - 0.05, zAt(M, y), 11.8, 6.9, 1.4);
  y = M.deckY + M.lowerH + M.topH - 1.5; squareSail(M, y - 0.05, zAt(M, y), 8.6, 4.8, 1.0);
  // mizzen square sails
  y = Mi.deckY + Mi.lowerH - 2.5;    squareSail(Mi, y - 0.05, zAt(Mi, y), 10.2, 5.6, 1.2);
  y = Mi.deckY + Mi.lowerH + 3.1;    squareSail(Mi, y - 0.05, zAt(Mi, y), 7.8, 4.6, 0.9);

  /* spanker: gaff sail aft of the mizzen */
  const gaffY = Mi.deckY + Mi.lowerH + 1.9, gaffZ = zAt(Mi, gaffY);
  const boomY = Mi.deckY + 1.4;
  // gaff + boom spars run fore-and-aft (rotate +Y onto +Z)
  S.add(MAT.spar, new T.CylinderGeometry(0.13, 0.10, 9.6, 8), [0, gaffY + 0.55, Mi.z + 4.6], [Math.PI / 2, 0, 0]);
  S.add(MAT.spar, new T.CylinderGeometry(0.13, 0.13, 9.8, 8), [0, boomY, Mi.z + 4.4], [Math.PI / 2, 0, 0]);
  const head = new T.Vector3(0, Mi.deckY + Mi.lowerH + 1.9, Mi.z + 0.4);
  const tack = new T.Vector3(0, boomY + 0.3, Mi.z + 0.4);
  const clew = new T.Vector3(0, boomY - 0.6, Mi.z + 9.3);
  const top = new T.Vector3(0, Mi.deckY + Mi.lowerH + 2.4, Mi.z + 9.2);
  const sp = gridGeometry(20, 20, (u, v, out) => {
    const a = new T.Vector3().lerpVectors(head, tack, v);
    const b = new T.Vector3().lerpVectors(top, clew, v);
    out.lerpVectors(a, b, u);
    out.x += -0.85 * Math.sin(Math.PI * u) * Math.pow(Math.sin(Math.PI * clamp(v * 0.9 + 0.05, 0, 1)), 0.5);
  }, (u, v) => [u * 2, v * 2]);
  S.add(MAT.cloth, sp);

  /* staysails on the bowsprit */
  const fTopTop = mastInfo.fore.topTop;
  const fLowerTop = mastInfo.fore.lowerTop;
  // jib: fore topmast head -> bowsprit -> clew aft
  S.add(MAT.cloth, sailTriGeo(
    new T.Vector3(0, fTopTop.y - 0.5, fTopTop.z + 0.25),
    BSP_ROOT.clone().addScaledVector(BSP_DIR, 4.5),
    new T.Vector3(0, fTopTop.y - 9.2, -7.6), 1.35, 22, 16));
  // fore staysail: fore lower masthead -> bowsprit root -> clew
  S.add(MAT.cloth, sailTriGeo(
    new T.Vector3(0, fLowerTop.y + 0.7, fLowerTop.z + 0.2),
    new T.Vector3(0, deckEdgeAt(1) + 1.8, HULL.zf - 2.0),
    new T.Vector3(0, fLowerTop.y - 6.0, -10.4), 1.15, 20, 14));
  // spritsail under the bowsprit
  S.addM(MAT.cloth, sailGeo(7.2, 4.4, 0.8, 16, 12),
    m4([0, BSP_ROOT.y + BSP_DIR.y * 9 - 0.4, BSP_ROOT.z + BSP_DIR.z * 9], [0, BRACE, 0]));

  S.build(group, { keep: true });
}

/* ---------------------------------------------------------------- */
/* Guns, lanterns, small details                                     */
/* ---------------------------------------------------------------- */
function buildGunsAndDetail(group, trailObjs) {
  const B = new Batcher();

  /* gun ports + cannon on the gun deck */
  const gunY = HULL.deckY - 1.35;
  for (let i = 0; i < 7; i++) {
    const s = 0.30 + i * 0.088;
    const z = HULL.zs - s * HULL.len;
    for (const side of [-1, 1]) {
      const u = side < 0 ? 0.13 : 0.87;
      const p = hullPointOffset(s, u, 0.06, new T.Vector3());
      const rot = [0, side * (Math.PI / 2), 0];
      // dark port opening
      B.add(MAT.paint, new T.BoxGeometry(0.06, 1.15, 1.15), [p.x + side * 0.05, gunY, p.z]);
      // frame
      B.add(MAT.trim, new T.BoxGeometry(0.14, 1.34, 0.12), [p.x + side * 0.06, gunY, p.z - 0.68]);
      B.add(MAT.trim, new T.BoxGeometry(0.14, 1.34, 0.12), [p.x + side * 0.06, gunY, p.z + 0.68]);
      B.add(MAT.trim, new T.BoxGeometry(0.14, 0.12, 1.44), [p.x + side * 0.06, gunY + 0.68, p.z]);
      B.add(MAT.trim, new T.BoxGeometry(0.14, 0.12, 1.44), [p.x + side * 0.06, gunY - 0.68, p.z]);
      // cannon barrel poking out
      B.add(MAT.iron, new T.CylinderGeometry(0.17, 0.22, 2.0, 10), [p.x + side * 0.55, gunY, p.z], [0, 0, side * Math.PI / 2]);
      B.add(MAT.iron, new T.CylinderGeometry(0.24, 0.24, 0.22, 10), [p.x + side * 1.38, gunY, p.z], [0, 0, side * Math.PI / 2]);
      B.add(MAT.iron, new T.SphereGeometry(0.24, 8, 6), [p.x - side * 0.22, gunY, p.z]);
    }
  }
  // deck guns (swivels) along the rails
  for (let i = 0; i < 4; i++) {
    const z = -7.5 + i * 5.4;
    for (const side of [-1, 1]) {
      const s = (HULL.zs - z) / HULL.len;
      const p = hullPointOffset(s, side < 0 ? 0.04 : 0.96, -0.7, new T.Vector3());
      B.add(MAT.iron, new T.CylinderGeometry(0.11, 0.13, 1.5, 8), [p.x, p.y + 1.35, p.z], [0, 0, side * Math.PI / 2]);
      B.add(MAT.trim, new T.BoxGeometry(0.5, 0.22, 0.5), [p.x, p.y + 0.95, p.z]);
      B.add(MAT.trim, new T.CylinderGeometry(0.09, 0.11, 0.6, 6), [p.x, p.y + 0.6, p.z]);
    }
  }

  /* stern lantern (the big one) */
  const lz = HULL.zs + 0.9, ly = 7.4;
  B.add(MAT.brass, new T.CylinderGeometry(0.16, 0.22, 1.2, 8), [0, ly - 1.5, lz - 0.3], [0.2, 0, 0]);
  B.add(MAT.brass, new T.BoxGeometry(0.95, 1.15, 0.95), [0, ly, lz]);
  B.add(MAT.glass, new T.BoxGeometry(0.78, 0.95, 0.78), [0, ly, lz]);
  B.add(MAT.brass, new T.ConeGeometry(0.78, 0.55, 4), [0, ly + 0.85, lz], [0, Math.PI / 4, 0]);
  B.add(MAT.brass, new T.SphereGeometry(0.1, 8, 6), [0, ly + 1.2, lz]);
  trailObjs.lanterns.push(new T.Vector3(0, ly, lz));
  trailObjs.lights.push({ pos: new T.Vector3(0, ly, lz), color: 0xffb45a, intensity: 9.0, dist: 26 });

  // quarterdeck lanterns
  for (const side of [-1, 1]) {
    const x = side * 3.4, y = 5.6, z = 8.6;
    B.add(MAT.brass, new T.BoxGeometry(0.44, 0.6, 0.44), [x, y, z]);
    B.add(MAT.glass, new T.BoxGeometry(0.32, 0.44, 0.32), [x, y, z]);
    B.add(MAT.brass, new T.ConeGeometry(0.36, 0.26, 4), [x, y + 0.42, z], [0, Math.PI / 4, 0]);
    trailObjs.lanterns.push(new T.Vector3(x, y, z));
  }

  /* catheads, channels, chainplates, boarding steps */
  for (const side of [-1, 1]) {
    const p = hullPointOffset(0.86, side < 0 ? 0.25 : 0.75, 0.1, new T.Vector3());
    B.add(MAT.trim, new T.BoxGeometry(1.9, 0.42, 0.5), [side * 4.0, deckEdgeAt(0.86) + 0.7, p.z], [0, 0, side * 0.25]);
    B.add(MAT.iron, new T.TorusGeometry(0.26, 0.05, 5, 10), [side * 4.6, deckEdgeAt(0.86) + 0.95, p.z], [Math.PI / 2, 0, 0]);
  }
  for (let i = 0; i < 5; i++) {
    const s = 0.55 + i * 0.05;
    for (const side of [-1, 1]) {
      const p = hullPointOffset(s, side < 0 ? 0.05 : 0.95, 0.35, new T.Vector3());
      B.add(MAT.trim, new T.BoxGeometry(0.55, 0.09, 0.42), [p.x, p.y - 0.2 - i * 0.55, p.z]);
    }
  }
  /* pump, shot racks, coiled ropes */
  const deckY0 = deckEdgeAt(0.5) - 0.42 + 0.34;
  B.add(MAT.trim, new T.CylinderGeometry(0.22, 0.22, 1.5, 8), [2.2, deckY0 + 0.75, 3.4]);
  B.add(MAT.trim, new T.CylinderGeometry(0.22, 0.22, 1.5, 8), [2.9, deckY0 + 0.75, 3.4]);
  for (let i = 0; i < 6; i++) B.add(MAT.iron, new T.SphereGeometry(0.14, 6, 5), [-2.0, deckY0 + 0.16, -2.2 + i * 0.3]);
  for (let i = 0; i < 5; i++) {
    B.add(MAT.rope, new T.TorusGeometry(0.42 - i * 0.02, 0.09, 5, 12), [-4.0, deckY0 + 0.1 + i * 0.13, 1.6], [Math.PI / 2, 0, 0]);
  }

  B.build(group, { keep: true });
}
